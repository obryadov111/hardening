name: Frontend CI

on:
  push:
    paths:
      - "src/**"
      - "!src/backend/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "vite.config.js"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "!src/backend/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "vite.config.js"
      - ".github/workflows/frontend-ci.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
