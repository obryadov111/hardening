# Проверка Windows-паков на НАСТОЯЩИХ Windows Server (раннеры GitHub) и сборка агента в .exe.
#
# live: агент выполняет пробы паков windows-server на реальной ОС (только чтение) — распознана ли
#   платформа, выполнилась ли каждая проба (секреты политики, GUID аудита, реестр, службы). Результат с
#   фактическими значениями — артефакт live-<ОС>.json: образцы с реальной системы.
#   Не ловит: опечатку в пути реестра — отсутствующий ключ для Windows норма («не задано» → умолчание).
#   Поэтому в артефакте видно, какие значения найдены в реестре, а какие взяты по умолчанию.
# exe: агент (collector.py + probes.py, только стандартная библиотека) собирается PyInstaller в один файл —
#   на Windows-хостах нет Python. Собранный файл прогоняется по подписанным манифестам без сервера.
name: Windows packs

on:
  push:
    paths:
      - "agent/**"
      - "src/backend/app/packs/windows-*"
      - "src/backend/app/services/packs/**"
      - "src/backend/app/commands/pack.py"
      - ".github/workflows/windows-packs.yml"
      - ".github/scripts/agent_fake_server.py"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # настройки бэкенда нужны только для импорта модулей; БД не используется
  DATABASE_URL: postgresql+psycopg://ci:ci@localhost:1/ci
  JWT_SECRET_KEY: ci
  TOTP_SECRET_ENCRYPTION_KEY: ci
  PACK_SIGNING_KEY: ci

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install pytest==8.3.5
          pip install -r src/backend/requirements.txt

      - name: Windows probe tests (agent)
        run: pytest agent/tests/test_windows_probes.py -v

      - name: OS and software inventory
        run: python -c "import sys; sys.path.insert(0, 'agent'); import collector; print(collector.get_windows_version()); print('программ:', len(collector.collect_windows_software()))"

      - name: Live run on real Windows Server
        working-directory: src/backend
        run: python -m app.commands.pack live --pack windows-server --require-found --json ../../live-${{ matrix.os }}.json

      - name: Client and domain controller packs must not match a member server
        working-directory: src/backend
        shell: pwsh
        run: |
          python -m app.commands.pack live --json ../../all-${{ matrix.os }}.json
          $detected = (Get-Content ../../all-${{ matrix.os }}.json | ConvertFrom-Json) | Where-Object { $_.detected } | ForEach-Object { $_.pack }
          Write-Output "распознаны: $detected"
          # раннер — рядовой сервер (ProductType = ServerNT), не контроллер домена
          if ($detected -contains 'windows-client' -or $detected -contains 'windows-dc' -or -not ($detected -contains 'windows-server')) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.os }}
          path: live-*.json

  exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install pyinstaller==6.11.1
          pip install -r src/backend/requirements.txt

      - name: Build hardening-agent.exe
        run: pyinstaller --onefile --name hardening-agent --paths agent --hidden-import probes agent/collector.py

      - name: Built agent runs on signed manifests without a server
        shell: pwsh
        run: |
          $key = [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
          Set-Content -NoNewline -Path ci.key -Value $key
          Push-Location src/backend
          python -m app.commands.pack manifests --key-file ../../ci.key --out ../../manifests.json
          # Ed25519: закрытый ключ — только у «сервера», агенту — открытый
          $ed = python -c "from app.services.packs.manifest import generate_ed25519_key as g; print(g())"
          Set-Content -NoNewline -Path ../../ci-ed.key -Value $ed
          $edPublic = python -c "from app.services.packs.manifest import ed25519_public_key as p; print(p('$ed'))"
          python -m app.commands.pack manifests --ed25519-key-file ../../ci-ed.key --out ../../manifests-ed.json
          $otherPublic = python -c "from app.services.packs.manifest import ed25519_public_key as p, generate_ed25519_key as g; print(p(g()))"
          Pop-Location
          .\dist\hardening-agent.exe --api-url http://localhost --environment ci --use-packs --dry-run --manifests-file manifests-ed.json --pack-public-key $edPublic | Out-File -Encoding utf8 payload-ed.json
          if ($LASTEXITCODE -ne 0) { Write-Output 'Ed25519: подпись не принята'; exit 1 }
          # открытый ключ другого сервера — отказ
          .\dist\hardening-agent.exe --api-url http://localhost --environment ci --use-packs --dry-run --manifests-file manifests-ed.json --pack-public-key $otherPublic
          if ($LASTEXITCODE -eq 0) { Write-Output 'Ed25519: чужая подпись принята'; exit 1 }
          $env:HARDENING_PACK_KEY = $key
          .\dist\hardening-agent.exe --api-url http://localhost --environment ci --use-packs --dry-run --manifests-file manifests.json | Out-File -Encoding utf8 payload.json
          $payload = Get-Content payload.json -Raw | ConvertFrom-Json
          $packs = $payload.packs | ForEach-Object { $_.id }
          Write-Output "агент (.exe): ОС = $($payload.asset.os); паки = $packs; ПО = $($payload.software.Count)"
          if (-not ($packs -contains 'windows-server')) { exit 1 }
          # подпись проверяется: чужой ключ — отказ
          $env:HARDENING_PACK_KEY = 'wrong-key'
          .\dist\hardening-agent.exe --api-url http://localhost --environment ci --use-packs --dry-run --manifests-file manifests.json
          if ($LASTEXITCODE -eq 0) { Write-Output 'подделка не обнаружена'; exit 1 }
          Copy-Item manifests-ed.json ci-manifests.json
          Set-Content -NoNewline -Path ci-ed-public.txt -Value $edPublic
          exit 0

      # Регистрация хоста настоящим .exe: ключ площадки -> ключ хоста в ProgramData (права только SYSTEM и
      # «Администраторы»), отчёт — ключом хоста; второй прогон — без ключа площадки.
      - name: Built agent enrolls the host and reports with the host key
        shell: pwsh
        run: |
          $state = "C:\ProgramData\HardeningAgent"
          $server = Start-Process python -ArgumentList ".github/scripts/agent_fake_server.py", "8799", "ci-manifests.json", "ci-requests.jsonl" -PassThru
          Start-Sleep -Seconds 3
          $edPublic = Get-Content ci-ed-public.txt -Raw
          $common = @("--api-url", "http://127.0.0.1:8799", "--environment", "ci", "--use-packs", "--pack-public-key", $edPublic)
          .\dist\hardening-agent.exe @common --api-key ci-site-key
          if ($LASTEXITCODE -ne 0) { Write-Output "первый прогон: код $LASTEXITCODE"; exit 1 }
          .\dist\hardening-agent.exe @common
          if ($LASTEXITCODE -ne 0) { Write-Output "второй прогон без ключа площадки: код $LASTEXITCODE"; exit 1 }
          Stop-Process -Id $server.Id
          $requests = Get-Content ci-requests.jsonl | ForEach-Object { $_ | ConvertFrom-Json }
          $enrolls = @($requests | Where-Object { $_.path -eq "/api/agent/enroll" })
          $ingests = @($requests | Where-Object { $_.path -eq "/api/ingest" })
          Write-Output "регистраций: $($enrolls.Count) (ключ $($enrolls[0].key), хост $($enrolls[0].body.hostname)); отчётов: $($ingests.Count), ключи: $($ingests.key -join ', ')"
          if ($enrolls.Count -ne 1 -or $enrolls[0].key -ne "ci-site-key") { exit 1 }
          if ($ingests.Count -ne 2 -or @($ingests | Where-Object { $_.key -ne "ci-host-key" }).Count) { exit 1 }
          if ($ingests[0].body.asset.hostname -ne $enrolls[0].body.hostname) { Write-Output "имя в отчёте не совпало с зарегистрированным"; exit 1 }
          # права: SYSTEM и Администраторы, без «Пользователей» и «Прошедших проверку» (SID — не зависят от языка)
          foreach ($path in @($state, "$state\host.json")) {
            $sids = (Get-Acl $path).Access | ForEach-Object { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value }
            Write-Output "$path : $($sids -join ', ')"
            if ($sids -contains "S-1-5-32-545" -or $sids -contains "S-1-5-11" -or $sids -contains "S-1-1-0") { Write-Output "доступ у пользователей"; exit 1 }
            if (-not ($sids -contains "S-1-5-18") -or -not ($sids -contains "S-1-5-32-544")) { Write-Output "нет SYSTEM или Администраторов"; exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hardening-agent-exe
          path: dist/hardening-agent.exe
