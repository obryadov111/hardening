# Проверка Windows-паков на НАСТОЯЩИХ Windows Server (раннеры GitHub) и сборка агента в .exe.
#
# live: агент выполняет пробы паков windows-server на реальной ОС (только чтение) — распознана ли
#   платформа, выполнилась ли каждая проба (секреты политики, GUID аудита, реестр, службы). Результат с
#   фактическими значениями — артефакт live-<ОС>.json: образцы с реальной системы.
#   Не ловит: опечатку в пути реестра — отсутствующий ключ для Windows норма («не задано» → умолчание).
#   Поэтому в артефакте видно, какие значения найдены в реестре, а какие взяты по умолчанию.
# exe: агент (collector.py + probes.py + usergate.py + continent4.py, только стандартная библиотека) собирается PyInstaller в один файл —
#   на Windows-хостах нет Python. Собранный файл прогоняется по подписанным манифестам без сервера.
name: Windows packs

on:
  push:
    paths:
      - "agent/**"
      - "deploy/windows/gpo/**"
      - "src/backend/app/packs/windows-*"
      - "src/backend/app/services/packs/**"
      - "src/backend/app/commands/pack.py"
      - ".github/workflows/windows-packs.yml"
      - ".github/scripts/agent_fake_server.py"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # настройки бэкенда нужны только для импорта модулей; БД не используется
  DATABASE_URL: postgresql+psycopg://ci:ci@localhost:1/ci
  JWT_SECRET_KEY: ci
  TOTP_SECRET_ENCRYPTION_KEY: ci
  PACK_SIGNING_KEY: ci

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install pytest==8.3.5
          pip install -r src/backend/requirements.txt

      - name: Windows probe tests (agent)
        run: pytest agent/tests/test_windows_probes.py -v

      - name: OS and software inventory
        run: python -c "import sys; sys.path.insert(0, 'agent'); import collector; print(collector.get_windows_version()); print('программ:', len(collector.collect_windows_software()))"

      - name: Live run on real Windows Server
        working-directory: src/backend
        run: python -m app.commands.pack live --pack windows-server --require-found --json ../../live-${{ matrix.os }}.json

      - name: Client and domain controller packs must not match a member server
        working-directory: src/backend
        shell: pwsh
        run: |
          python -m app.commands.pack live --json ../../all-${{ matrix.os }}.json
          $detected = (Get-Content ../../all-${{ matrix.os }}.json | ConvertFrom-Json) | Where-Object { $_.detected } | ForEach-Object { $_.pack }
          Write-Output "распознаны: $detected"
          # раннер — рядовой сервер (ProductType = ServerNT), не контроллер домена
          if ($detected -contains 'windows-client' -or $detected -contains 'windows-dc' -or -not ($detected -contains 'windows-server')) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-${{ matrix.os }}
          path: live-*.json

  exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install pyinstaller==6.11.1
          pip install -r src/backend/requirements.txt

      - name: Build hardening-agent.exe
        run: pyinstaller --onefile --name hardening-agent --paths agent --hidden-import probes --hidden-import usergate --hidden-import continent4 agent/collector.py

      - name: Built agent runs on signed manifests without a server
        shell: pwsh
        run: |
          $key = [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
          Set-Content -NoNewline -Path ci.key -Value $key
          Push-Location src/backend
          python -m app.commands.pack manifests --key-file ../../ci.key --out ../../manifests.json
          # Ed25519: закрытый ключ — только у «сервера», агенту — открытый
          $ed = python -c "from app.services.packs.manifest import generate_ed25519_key as g; print(g())"
          Set-Content -NoNewline -Path ../../ci-ed.key -Value $ed
          $edPublic = python -c "from app.services.packs.manifest import ed25519_public_key as p; print(p('$ed'))"
          python -m app.commands.pack manifests --ed25519-key-file ../../ci-ed.key --out ../../manifests-ed.json
          $otherPublic = python -c "from app.services.packs.manifest import ed25519_public_key as p, generate_ed25519_key as g; print(p(g()))"
          Pop-Location
          .\dist\hardening-agent.exe --api-url http://localhost --environment ci --use-packs --dry-run --manifests-file manifests-ed.json --pack-public-key $edPublic | Out-File -Encoding utf8 payload-ed.json
          if ($LASTEXITCODE -ne 0) { Write-Output 'Ed25519: подпись не принята'; exit 1 }
          # открытый ключ другого сервера — отказ
          .\dist\hardening-agent.exe --api-url http://localhost --environment ci --use-packs --dry-run --manifests-file manifests-ed.json --pack-public-key $otherPublic
          if ($LASTEXITCODE -eq 0) { Write-Output 'Ed25519: чужая подпись принята'; exit 1 }
          $env:HARDENING_PACK_KEY = $key
          .\dist\hardening-agent.exe --api-url http://localhost --environment ci --use-packs --dry-run --manifests-file manifests.json | Out-File -Encoding utf8 payload.json
          $payload = Get-Content payload.json -Raw | ConvertFrom-Json
          $packs = $payload.packs | ForEach-Object { $_.id }
          Write-Output "агент (.exe): ОС = $($payload.asset.os); паки = $packs; ПО = $($payload.software.Count)"
          if (-not ($packs -contains 'windows-server')) { exit 1 }
          # подпись проверяется: чужой ключ — отказ
          $env:HARDENING_PACK_KEY = 'wrong-key'
          .\dist\hardening-agent.exe --api-url http://localhost --environment ci --use-packs --dry-run --manifests-file manifests.json
          if ($LASTEXITCODE -eq 0) { Write-Output 'подделка не обнаружена'; exit 1 }
          Copy-Item manifests-ed.json ci-manifests.json
          Set-Content -NoNewline -Path ci-ed-public.txt -Value $edPublic
          exit 0

      # Регистрация хоста настоящим .exe: ключ площадки -> ключ хоста в ProgramData (права только SYSTEM и
      # «Администраторы»), отчёт — ключом хоста; второй прогон — без ключа площадки.
      - name: Built agent enrolls the host and reports with the host key
        shell: pwsh
        run: |
          $state = "C:\ProgramData\HardeningAgent"
          $server = Start-Process python -ArgumentList ".github/scripts/agent_fake_server.py", "8799", "ci-manifests.json", "ci-requests.jsonl" -PassThru
          Start-Sleep -Seconds 3
          $edPublic = Get-Content ci-ed-public.txt -Raw
          $common = @("--api-url", "http://127.0.0.1:8799", "--environment", "ci", "--use-packs", "--pack-public-key", $edPublic)
          .\dist\hardening-agent.exe @common --api-key ci-site-key
          if ($LASTEXITCODE -ne 0) { Write-Output "первый прогон: код $LASTEXITCODE"; exit 1 }
          .\dist\hardening-agent.exe @common
          if ($LASTEXITCODE -ne 0) { Write-Output "второй прогон без ключа площадки: код $LASTEXITCODE"; exit 1 }
          Stop-Process -Id $server.Id
          $requests = Get-Content ci-requests.jsonl | ForEach-Object { $_ | ConvertFrom-Json }
          $enrolls = @($requests | Where-Object { $_.path -eq "/api/agent/enroll" })
          $ingests = @($requests | Where-Object { $_.path -eq "/api/ingest" })
          Write-Output "регистраций: $($enrolls.Count) (ключ $($enrolls[0].key), хост $($enrolls[0].body.hostname)); отчётов: $($ingests.Count), ключи: $($ingests.key -join ', ')"
          if ($enrolls.Count -ne 1 -or $enrolls[0].key -ne "ci-site-key") { exit 1 }
          if ($ingests.Count -ne 2 -or @($ingests | Where-Object { $_.key -ne "ci-host-key" }).Count) { exit 1 }
          if ($ingests[0].body.asset.hostname -ne $enrolls[0].body.hostname) { Write-Output "имя в отчёте не совпало с зарегистрированным"; exit 1 }
          # права: SYSTEM и Администраторы, без «Пользователей» и «Прошедших проверку» (SID — не зависят от языка)
          foreach ($path in @($state, "$state\host.json")) {
            $sids = (Get-Acl $path).Access | ForEach-Object { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value }
            Write-Output "$path : $($sids -join ', ')"
            if ($sids -contains "S-1-5-32-545" -or $sids -contains "S-1-5-11" -or $sids -contains "S-1-1-0") { Write-Output "доступ у пользователей"; exit 1 }
            if (-not ($sids -contains "S-1-5-18") -or -not ($sids -contains "S-1-5-32-544")) { Write-Output "нет SYSTEM или Администраторов"; exit 1 }
          }

      # Сценарий запуска компьютера для GPO (Windows PowerShell 5.1, как в GPO): автозагрузка только
      # ставит задачу bootstrap и сразу выходит (сервер недоступен — не код 1 и не ожидание следующей загрузки).
      # Задача от SYSTEM с одним экземпляром доводит установку: SHA-256, регистрация, задача сбора и первый прогон.
      # Повторный запуск ничего не меняет; -Schedule Weekly переводит задачу на еженедельную; подменённый файл
      # не ставится; задача от SYSTEM читает ключ хоста и отправляет отчёт. Ключ площадки не попадает в журнал
      # и в аргументы задачи bootstrap.
      - name: GPO startup script
        shell: pwsh
        run: |
          function Wait-GpoCount([string]$Path, [string]$Pattern, [int]$Count, [int]$Seconds = 120) {
            for ($i = 0; $i -lt $Seconds; $i++) {
              if ((Test-Path $Path) -and (@(Select-String -Path $Path -Pattern $Pattern -Encoding UTF8).Count -ge $Count)) { return $true }
              Start-Sleep -Seconds 1
            }
            return $false
          }
          $fast = @("-InitialJitterMaxSeconds", "0", "-RetryBudgetSeconds", "20", "-BootstrapRandomDelayMinutes", "0")
          # Сервер ещё не слушает: автозагрузка не блокирует вход и уже создаёт постоянную задачу.
          $failState = "C:\ProgramData\HardeningAgentGpoFail"
          $failClock = [Diagnostics.Stopwatch]::StartNew()
          $fail = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "deploy\windows\gpo\gpo-startup.ps1",
                    "-Server", "http://127.0.0.1:9", "-SiteKey", "ci-site-key", "-InstallDir", "C:\HardeningGpoFail",
                    "-StateDir", $failState, "-AllowHttp") + $fast
          powershell.exe @fail
          $failClock.Stop()
          if ($LASTEXITCODE -ne 0) { Get-Content "$failState\gpo-startup.log" -ErrorAction SilentlyContinue; Write-Output "автозагрузка вернула $($LASTEXITCODE)"; exit 1 }
          if ($failClock.Elapsed.TotalSeconds -gt 20) { Write-Output "автозагрузка блокировала запуск $($failClock.Elapsed.TotalSeconds) с"; exit 1 }
          $boot = Get-ScheduledTask -TaskName "Hardening agent bootstrap"
          Write-Output "bootstrap: $($boot.Principal.UserId) instances=$($boot.Settings.MultipleInstances) limit=$($boot.Settings.ExecutionTimeLimit)"
          if ($boot.Principal.UserId -notmatch "SYSTEM|S-1-5-18") { Write-Output "задача не от SYSTEM"; exit 1 }
          if ($boot.Actions[0].Arguments -match "ci-site-key" -or $boot.Actions[0].Arguments -match "-SiteKey") { Write-Output "секрет в аргументах задачи"; exit 1 }
          if (-not (Wait-GpoCount "$failState\gpo-startup.log" "stage=done" 1 45)) { Get-Content "$failState\gpo-startup.log"; Write-Output "worker не завершился"; exit 1 }
          if (-not (Select-String -Path "$failState\gpo-startup.log" -Pattern "code=VERSION_UNAVAILABLE" -Quiet)) { Get-Content "$failState\gpo-startup.log"; Write-Output "нет кода VERSION_UNAVAILABLE"; exit 1 }
          if (Select-String -Path "$failState\gpo-startup.log" -Pattern "ci-site-key" -Quiet) { Write-Output "секрет в журнале"; exit 1 }
          if (-not (Select-String -Path "$failState\gpo-startup.log" -Pattern "stage=startup code=TASK_SCHEDULED" -Quiet)) { Write-Output "нет стадии постановки задачи"; exit 1 }
          $instances = [string]$boot.Settings.MultipleInstances
          if ($instances -ne "IgnoreNew" -and $instances -ne "2") { Write-Output "нет single-instance: $instances"; exit 1 }
          Stop-ScheduledTask -TaskName "Hardening agent bootstrap" -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName "Hardening agent bootstrap" -Confirm:$false
          Start-Sleep -Seconds 2
          $state = "C:\ProgramData\HardeningAgentGPO"; $install = "C:\HardeningGPO"; $share = "C:\share"
          New-Item -ItemType Directory -Force -Path $share | Out-Null
          Copy-Item dist\hardening-agent.exe "$share\hardening-agent.exe"
          Remove-Item ci-requests.jsonl -ErrorAction SilentlyContinue
          $server = Start-Process python -ArgumentList ".github/scripts/agent_fake_server.py", "8799", "ci-manifests.json", "ci-requests.jsonl", "dist\hardening-agent.exe" -PassThru
          Start-Sleep -Seconds 3
          $edPublic = Get-Content ci-ed-public.txt -Raw
          $gpo = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "deploy\windows\gpo\gpo-startup.ps1", "-Server", "http://127.0.0.1:8799",
                   "-SiteKey", "ci-site-key", "-PackPublicKey", $edPublic, "-Share", $share, "-InstallDir", $install, "-StateDir", $state, "-AllowHttp") + $fast
          powershell.exe @gpo
          if ($LASTEXITCODE -ne 0) { Get-Content "$state\gpo-startup.log"; exit 1 }
          if (-not (Wait-GpoCount "$state\gpo-startup.log" "stage=done code=OK" 1 240)) { Get-Content "$state\gpo-startup.log"; exit 1 }
          powershell.exe @gpo   # повторный запуск при следующей загрузке
          if ($LASTEXITCODE -ne 0) { Get-Content "$state\gpo-startup.log"; exit 1 }
          if (-not (Wait-GpoCount "$state\gpo-startup.log" "stage=done code=OK" 2 240)) { Get-Content "$state\gpo-startup.log"; exit 1 }
          Get-Content "$state\gpo-startup.log"
          if (Select-String -Path "$state\gpo-startup.log" -Pattern "ci-site-key" -Quiet) { Write-Output "секрет в журнале"; exit 1 }
          $enrolls = @(Get-Content ci-requests.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.path -eq "/api/agent/enroll" })
          if ($enrolls.Count -ne 1) { Write-Output "регистраций: $($enrolls.Count), ожидалась одна"; exit 1 }
          if (@(Select-String -Path "$state\gpo-startup.log" -Pattern "установлен агент").Count -ne 1) { Write-Output "агент ставился повторно"; exit 1 }
          # ответ агента (UTF-8) в журнале читается, а не кракозябрами кодовой страницы консоли
          if (-not (Select-String -Path "$state\gpo-startup.log" -Pattern "зарегистрирован на сервере" -Encoding UTF8 -Quiet)) { Write-Output "ответ агента в журнале нечитаем"; exit 1 }
          $task = Get-ScheduledTask -TaskName "Hardening agent"
          Write-Output "задача: $($task.Principal.UserId) $($task.Actions[0].Execute) $($task.Actions[0].Arguments); разброс $($task.Triggers[0].RandomDelay); старт $($task.Triggers[0].StartBoundary); $($task.Triggers[0].CimClass.CimClassName)"
          if ($task.Actions[0].Execute -ne "$install\hardening-agent.exe" -or $task.Triggers[0].RandomDelay -ne "PT2H" -or
              [string]$task.Triggers[0].StartBoundary -notmatch "T07:30" -or
              $task.Triggers[0].CimClass.CimClassName -ne "MSFT_TaskDailyTrigger") { exit 1 }
          if (-not $task.Settings.StartWhenAvailable) { Write-Output "сбор без StartWhenAvailable"; exit 1 }
          $collectInstances = [string]$task.Settings.MultipleInstances
          if ($collectInstances -ne "IgnoreNew" -and $collectInstances -ne "2") { Write-Output "сбор не IgnoreNew: $collectInstances"; exit 1 }
          if ($task.Principal.UserId -notmatch "SYSTEM|S-1-5-18") { Write-Output "сбор не от SYSTEM"; exit 1 }
          if (@(Select-String -Path "$state\gpo-startup.log" -Pattern "code=TASK_UPDATED" -Encoding UTF8).Count -ne 1) { Write-Output "TASK_UPDATED не один раз"; Get-Content "$state\gpo-startup.log"; exit 1 }
          if (@(Select-String -Path "$state\gpo-startup.log" -Pattern "code=TASK_UNCHANGED" -Encoding UTF8).Count -lt 1) { Write-Output "повтор не увидел ту же задачу"; Get-Content "$state\gpo-startup.log"; exit 1 }
          if (@(Select-String -Path "$state\gpo-startup.log" -Pattern "code=SPOOL_UPDATED" -Encoding UTF8).Count -ne 1) { Write-Output "SPOOL_UPDATED не один раз"; Get-Content "$state\gpo-startup.log"; exit 1 }
          $spoolTask = Get-ScheduledTask -TaskName "Hardening agent spool"
          $spoolXml = Export-ScheduledTask -TaskName "Hardening agent spool"
          if ($spoolXml -is [System.Array]) { $spoolXml = $spoolXml -join "`n" }
          Write-Output "досылка: $($spoolTask.Principal.UserId) $($spoolTask.Actions[0].Arguments); delay=$($spoolTask.Triggers[0].RandomDelay); interval=$($spoolTask.Triggers[0].Repetition.Interval); duration=$($spoolTask.Triggers[0].Repetition.Duration)"
          if ($spoolTask.Actions[0].Execute -ne "$install\hardening-agent.exe") { exit 1 }
          if ($spoolTask.Actions[0].Arguments -notmatch "flush-spool" -or $spoolTask.Actions[0].Arguments -match "--use-packs") { Write-Output "досылка запускает полный сбор"; exit 1 }
          if ($spoolTask.Principal.UserId -notmatch "SYSTEM|S-1-5-18") { Write-Output "досылка не от SYSTEM"; exit 1 }
          $spoolInstances = [string]$spoolTask.Settings.MultipleInstances
          if ($spoolInstances -ne "IgnoreNew" -and $spoolInstances -ne "2") { Write-Output "досылка не IgnoreNew: $spoolInstances"; exit 1 }
          if (-not $spoolTask.Settings.StartWhenAvailable) { Write-Output "досылка без StartWhenAvailable"; exit 1 }
          if ([string]$spoolTask.Triggers[0].StartBoundary -notmatch "T07:30") { Write-Output "досылка не в 07:30"; exit 1 }
          if ($spoolXml -notmatch "<Interval>PT30M</Interval>" -or $spoolXml -notmatch "<Duration>PT10H</Duration>" -or $spoolXml -notmatch "<StopAtDurationEnd>true</StopAtDurationEnd>") {
            Write-Output $spoolXml; Write-Output "повтор досылки не PT30M/PT10H"; exit 1
          }
          if ($spoolXml -notmatch "<RandomDelay>PT30M</RandomDelay>") { Write-Output "нет разброса досылки"; exit 1 }
          function Get-Ingests { @(Get-Content ci-requests.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.path -eq "/api/ingest" }) }
          function Wait-Task([int]$expected) {
            for ($i = 0; $i -lt 90 -and ((Get-Ingests).Count -lt $expected -or (Get-ScheduledTask -TaskName "Hardening agent").State -eq "Running"); $i++) { Start-Sleep -Seconds 2 }
          }
          # первый прогон — сразу после регистрации, один на два запуска сценария
          if (@(Select-String -Path "$state\gpo-startup.log" -Pattern "первый прогон запущен").Count -ne 1) { Write-Output "первый прогон запускался не один раз"; exit 1 }
          Wait-Task 1
          $info = Get-ScheduledTaskInfo -TaskName "Hardening agent"
          $ingests = Get-Ingests
          Write-Output "первый прогон: код $($info.LastTaskResult); отчётов: $($ingests.Count), ключ $($ingests[0].key)"
          if ($info.LastTaskResult -ne 0 -or $ingests.Count -ne 1 -or $ingests[0].key -ne "ci-host-key") { exit 1 }
          # задача от SYSTEM: читает ключ хоста из каталога с правами SYSTEM/Администраторы и отправляет отчёт
          Start-ScheduledTask -TaskName "Hardening agent"
          Wait-Task 2
          $info = Get-ScheduledTaskInfo -TaskName "Hardening agent"
          $ingests = Get-Ingests
          Write-Output "задача завершилась с кодом $($info.LastTaskResult); отчётов: $($ingests.Count), ключи $($ingests.key -join ', ')"
          if ($info.LastTaskResult -ne 0 -or $ingests.Count -ne 2 -or @($ingests | Where-Object { $_.key -ne "ci-host-key" }).Count) { exit 1 }
          # Досылка очереди: один готовый файл уходит, нового сбора нет. Пустая очередь — код 0 и без запроса.
          $spoolDir = Join-Path $env:ProgramData "HardeningAgent\spool"
          New-Item -ItemType Directory -Force -Path $spoolDir | Out-Null
          Get-ChildItem $spoolDir -Filter *.json -ErrorAction SilentlyContinue | Remove-Item -Force
          $spoolFile = Join-Path $spoolDir "20261112T040000-spool-flush-ci.json"
          Set-Content -Path $spoolFile -Value '{"run_id":"spool-flush-ci","collected_at":"2026-11-12T04:00:00+00:00","marker":"queued-only"}' -Encoding ascii
          $beforeFlush = (Get-Ingests).Count
          Start-ScheduledTask -TaskName "Hardening agent spool"
          for ($i = 0; $i -lt 60 -and ((Get-Ingests).Count -le $beforeFlush -or (Get-ScheduledTask -TaskName "Hardening agent spool").State -eq "Running"); $i++) { Start-Sleep -Seconds 1 }
          $flushed = @(@(Get-Ingests) | Select-Object -Skip $beforeFlush)
          Write-Output "досылка прислала $($flushed.Count)"
          if ($flushed.Count -ne 1 -or $flushed[0].body.marker -ne "queued-only" -or $flushed[0].key -ne "ci-host-key") {
            Write-Output ($flushed | ConvertTo-Json -Compress -Depth 6)
            Get-ScheduledTaskInfo -TaskName "Hardening agent spool" | Format-List
            exit 1
          }
          if (Test-Path $spoolFile) { Write-Output "файл очереди остался"; exit 1 }
          $beforeEmpty = (Get-Ingests).Count
          Start-ScheduledTask -TaskName "Hardening agent spool"
          for ($i = 0; $i -lt 40 -and (Get-ScheduledTask -TaskName "Hardening agent spool").State -eq "Running"; $i++) { Start-Sleep -Seconds 1 }
          $emptyInfo = Get-ScheduledTaskInfo -TaskName "Hardening agent spool"
          if ($emptyInfo.LastTaskResult -ne 0 -or (Get-Ingests).Count -ne $beforeEmpty) {
            Write-Output "пустая досылка: код $($emptyInfo.LastTaskResult), отчётов $((Get-Ingests).Count) было $beforeEmpty"
            exit 1
          }
          # -Schedule Weekly: задача пересоздаётся еженедельной, без новой регистрации и внепланового прогона
          powershell.exe @gpo -Schedule Weekly
          if ($LASTEXITCODE -ne 0) { Get-Content "$state\gpo-startup.log"; exit 1 }
          if (-not (Wait-GpoCount "$state\gpo-startup.log" "расписание Weekly" 1)) { Get-Content "$state\gpo-startup.log"; exit 1 }
          $trigger = (Get-ScheduledTask -TaskName "Hardening agent").Triggers[0]
          Write-Output "еженедельно: $($trigger.CimClass.CimClassName), дни $($trigger.DaysOfWeek), разброс $($trigger.RandomDelay)"
          if ($trigger.CimClass.CimClassName -ne "MSFT_TaskWeeklyTrigger" -or $trigger.RandomDelay -ne "PT2H" -or
              [string]$trigger.StartBoundary -notmatch "T07:30") { exit 1 }
          $requests = @(Get-Content ci-requests.jsonl | ForEach-Object { $_ | ConvertFrom-Json })
          if (@($requests | Where-Object { $_.path -eq "/api/agent/enroll" }).Count -ne 1 -or (Get-Ingests).Count -ne 3) { Write-Output "лишняя регистрация или прогон"; exit 1 }
          $spoolAfterWeekly = Get-ScheduledTask -TaskName "Hardening agent spool"
          if ($spoolAfterWeekly.Actions[0].Arguments -notmatch "flush-spool") { Write-Output "недельное расписание сняло досылку"; exit 1 }
          # подменённый файл в общей папке не ставится; автозагрузка при этом уже вышла 0, ошибка — в журнале worker
          Remove-Item "$install\hardening-agent.exe"
          Set-Content -Path "$share\hardening-agent.exe" -Value "подделка"
          powershell.exe @gpo
          if ($LASTEXITCODE -ne 0) { Get-Content "$state\gpo-startup.log"; Write-Output "автозагрузка не должна ждать сверку SHA"; exit 1 }
          if (-not (Wait-GpoCount "$state\gpo-startup.log" "code=SHA256_MISMATCH" 1)) { Get-Content "$state\gpo-startup.log"; exit 1 }
          if (Test-Path "$install\hardening-agent.exe") { Write-Output "подменённый агент установлен"; exit 1 }
          Select-String -Path "$state\gpo-startup.log" -Pattern "SHA-256" | Select-Object -Last 1
          Stop-Process -Id $server.Id
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: hardening-agent-exe
          path: dist/hardening-agent.exe
