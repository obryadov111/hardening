# Проверка Linux-паков (RHEL- и Debian-семейства, РЕД ОС, Astra) на НАСТОЯЩИХ файлах ОС: агент (системный python3 дистрибутива) запускается в
# контейнерах официальных образов с типовыми серверными пакетами и умолчаниями дистрибутива; результат
# оценивается логикой сервера (pack evaluate). Падает, если пак не распознал ОС или файловая проба
# не выполнилась — например, дистрибутив в новой версии поменял путь или формат.
# В контейнере нет systemd и kmod — пробы, которым нужны systemctl или modprobe, здесь «не проверено» по
# построению: разрешено по причине (--allow-missing-command), а не списком проверок — новая проверка служб
# не ломает CI. --allow-error — для проб, которые падают в контейнере иначе (systemctl без systemd в RHEL).
# Образы «плавающие» (rockylinux:9 и т. п.): падение после выхода новой версии ОС — полезный сигнал.
name: Linux packs

on:
  push:
    paths:
      - "agent/**"
      - "src/backend/app/packs/rhel-family-*"
      - "src/backend/app/packs/ubuntu-server-*"
      - "src/backend/app/packs/debian-server-*"
      - "src/backend/app/packs/astra-linux-*"
      - "src/backend/app/packs/alt-linux-*"
      - "src/backend/app/services/packs/**"
      - "src/backend/app/commands/pack.py"
      - ".github/scripts/agent-in-container.sh"
      - ".github/workflows/linux-packs.yml"
  workflow_dispatch:

env:
  DATABASE_URL: postgresql+psycopg://ci:ci@localhost:1/ci
  JWT_SECRET_KEY: ci
  TOTP_SECRET_ENCRYPTION_KEY: ci
  PACK_SIGNING_KEY: ci

jobs:
  live:
    name: ${{ matrix.image }} → ${{ matrix.pack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # RHEL-семейство; без systemd в контейнере службы — «не проверено» по построению
          - { image: "rockylinux:8", pack: rhel-family, allow: "firewall.firewalld_active logging.auditd_active services.telnet_inactive" }
          - { image: "rockylinux:9", pack: rhel-family, allow: "firewall.firewalld_active logging.auditd_active services.telnet_inactive" }
          - { image: "almalinux:9", pack: rhel-family, allow: "firewall.firewalld_active logging.auditd_active services.telnet_inactive" }
          - { image: "oraclelinux:9", pack: rhel-family, allow: "firewall.firewalld_active logging.auditd_active services.telnet_inactive" }
          - { image: "quay.io/centos/centos:stream9", pack: rhel-family, allow: "firewall.firewalld_active logging.auditd_active services.telnet_inactive" }
          - { image: "registry.red-soft.ru/ubi7/ubi:latest", pack: rhel-family, allow: "firewall.firewalld_active logging.auditd_active services.telnet_inactive" }   # РЕД ОС 7.3
          - { image: "registry.red-soft.ru/ubi8/ubi:latest", pack: rhel-family, allow: "firewall.firewalld_active logging.auditd_active services.telnet_inactive" }   # РЕД ОС 8
          # Debian-семейство (Debian 11 — пакеты из archive.debian.org, поддержка закончилась)
          - { image: "ubuntu:20.04", pack: ubuntu-server, allow: "logging.auditd_active" }
          - { image: "ubuntu:22.04", pack: ubuntu-server, allow: "logging.auditd_active" }
          - { image: "ubuntu:24.04", pack: ubuntu-server, allow: "logging.auditd_active" }
          - { image: "debian:11", pack: debian-server, allow: "logging.auditd_active" }
          - { image: "debian:12", pack: debian-server, allow: "logging.auditd_active" }
          - { image: "debian:13", pack: debian-server, allow: "logging.auditd_active" }
          - { image: "registry.astralinux.ru/library/astra/ubi18:latest", pack: astra-linux, allow: "logging.auditd_active" }   # Astra SE 1.8
          # Альт
          - { image: "alt:p10", pack: alt-linux, allow: "logging.auditd_active" }
          - { image: "alt:p11", pack: alt-linux, allow: "logging.auditd_active" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/backend/requirements.txt

      - name: Signed manifests
        working-directory: src/backend
        run: |
          mkdir -p ../../work
          head -c 32 /dev/urandom | base64 > ../../work/key
          python -m app.commands.pack manifests --key-file ../../work/key --out ../../work/manifests.json

      # Реестр РЕД ОС подписан Russian Trusted Root CA (Минцифры), которого нет у раннера GitHub
      - name: Russian Trusted CA for registry.red-soft.ru
        if: startsWith(matrix.image, 'registry.red-soft.ru/')
        run: |
          sudo mkdir -p /etc/docker/certs.d/registry.red-soft.ru
          sudo cp deploy/certs/russian-trusted-ca.pem /etc/docker/certs.d/registry.red-soft.ru/ca.crt

      # Реестры вне GitHub (Astra, РЕД ОС) иногда не отвечают — три попытки скачать образ
      - name: Pull ${{ matrix.image }}
        run: |
          for attempt in 1 2 3; do
            docker pull -q "${{ matrix.image }}" && exit 0
            echo "попытка $attempt не удалась, повтор через 20 с" >&2
            sleep 20
          done
          exit 1

      - name: Agent inside ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/agent:/agent:ro" -v "$PWD/work:/work:ro" -v "$PWD/.github/scripts:/scripts:ro" \
            "${{ matrix.image }}" sh /scripts/agent-in-container.sh > payload.json

      - name: Evaluate ${{ matrix.pack }}
        working-directory: src/backend
        run: |
          args=""
          for check in ${{ matrix.allow }}; do args="$args --allow-error $check"; done
          python -m app.commands.pack evaluate ../../payload.json --pack ${{ matrix.pack }} $args \
            --allow-missing-command systemctl --allow-missing-command modprobe
