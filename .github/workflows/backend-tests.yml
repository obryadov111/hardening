name: Backend tests

on:
  push:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_test_db
      JWT_SECRET_KEY: ci-secret-key
      TOTP_SECRET_ENCRYPTION_KEY: ci-totp-encryption-key

    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest tests/ -v
