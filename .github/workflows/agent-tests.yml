name: Agent tests

on:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent-tests.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Агент не имеет зависимостей — pytest нужен только для тестов.
      - name: Install pytest
        run: pip install pytest==8.3.5

      - name: Run pytest
        run: pytest agent/tests -v

  # Агент должен работать на системном Python старых дистрибутивов: RHEL 8 / Rocky 8 — 3.6,
  # РЕД ОС 7.3 — 3.8, RHEL 9 — 3.9. Аннотации вида str | None вне кавычек, capture_output= и т. п.
  # здесь падают — раньше это обнаружилось только живым прогоном на Rocky 9.
  python36-rocky8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent tests on Rocky Linux 8 system Python 3.6
        run: |
          docker run --rm -v "$PWD/agent:/agent:ro" rockylinux:8 sh -c '
            dnf -y -q install python3 python3-pip >/dev/null && pip3 install -q pytest==7.0.1 &&
            cp -r /agent /tmp/a && cd /tmp/a && python3 --version && python3 -m pytest tests -q -p no:cacheprovider'
