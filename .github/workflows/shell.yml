# Скрипты деплоя и установки агента управляют продом и хостами заказчика: shellcheck (предупреждения и
# ошибки) на каждое изменение. На раннере GitHub shellcheck уже установлен.
name: Shell scripts

on:
  push:
    paths:
      - "**.sh"
      - ".github/workflows/shell.yml"
  pull_request:
    paths:
      - "**.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning deploy/*.sh agent/deploy/install.sh .github/scripts/*.sh
