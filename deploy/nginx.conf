# Продакшен-фронтенд: статика собранного React-приложения + прокси /api и /health в бэкенд.
# Тот же origin, что и в dev (vite.config.js): браузер ходит на /api текущего адреса, без CORS.
#
# Образ nginx-unprivileged: nginx работает не от root и слушает 8080 (наружу публикуется как 80).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Встроенный DNS Docker: имя бэкенда разрешается при каждом запросе, а не один раз при старте
    # nginx — иначе после пересоздания hardening_backend (новый IP) прокси бил бы в старый адрес.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://hardening_backend:8000;

    location /api/ {
        # proxy_pass с переменной передаёт исходный URI целиком (/api/...), как и ждёт бэкенд.
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # выгрузка PDF/Excel
    }

    location = /health {
        proxy_pass $backend;
    }

    # Файлы сборки Vite с хэшем в имени не меняются — кэшируются надолго. Каталог — /static/, а не
    # стандартный /assets/: /assets/<id> — маршрут карточки актива в приложении (vite.config.js).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Маршруты React Router (/assets/<id>, /scans и т. п.) отдаются через index.html;
    # сам index.html не кэшируется, чтобы после выкатки сразу подхватывалась новая сборка.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
