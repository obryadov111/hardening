# Продакшен-фронтенд по HTTP (локальная сеть, VPN, стенд без домена). С доменом — HTTPS:
# deploy/nginx-tls.conf.template, включается deploy/enable_https.sh.
#
# Образ nginx-unprivileged: nginx работает не от root и слушает 8080 (наружу публикуется как 80).

server {
    listen 8080;
    server_name _;
    set $hsts "";

    include /etc/nginx/hardening-app.conf;
}
