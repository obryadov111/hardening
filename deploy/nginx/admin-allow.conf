# Откуда открываются сайт, вход и API интерфейса (пути агентов и /health открыты всем — deploy/nginx/app.conf).
# Это значение по умолчанию, вшитое в образ: частные сети. На сервере его заменяет файл, который
# deploy/restart_frontend.sh собирает из HARDENING_ADMIN_NETWORKS (deploy/frontend.env).
#
# Шлюз Docker — первым и запретом: через docker-proxy (например, клиенты по IPv6) запрос приходит
# в контейнер с адреса шлюза, и разрешение 172.16.0.0/12 открыло бы интерфейс всему интернету.
deny 172.17.0.1;
allow 127.0.0.1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;
