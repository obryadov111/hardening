# Ограничение частоты запросов (уровень http, общий для HTTP- и HTTPS-сервера).
#
# Агенты — по ключу, а не по адресу: за одним NAT заказчика бывает тысяча хостов, и лимит по адресу
# отказывал бы им всем сразу. У каждого хоста свой ключ (регистрация хостов), прогон — 2 запроса
# (паки + результат) плюс досылка очереди: agent_key — лимит одного хоста. Регистрацию по одному ключу
# площадки проходят все её хосты (GPO при включении ПК утром) — enroll_key с запасом на тысячу хостов.
# agents — общий потолок с одного адреса против потока запросов с выдуманными ключами (каждый — запрос в
# БД); он рассчитан на крупный NAT: 1000 хостов за час — около 50 запросов в минуту.
# Запрос без ключа в зоны по ключу не попадает (пустой ключ nginx не учитывает) — его ограничивает agents.
limit_req_zone $http_x_agent_api_key zone=agent_key:20m rate=30r/m;
limit_req_zone $http_x_agent_api_key zone=enroll_key:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=agents:10m rate=3000r/m;

# Обратное давление: одновременно в бэкенде — не больше, чем он обрабатывает (нагрузочный тест: 2 процесса
# uvicorn, по 15 соединений с БД; разбор отчёта — ~0,4 с CPU). Сверх этого — сразу 503 с Retry-After, агент
# повторяет через 10–90 с со случайной добавкой. Без ограничения 50 одновременных отчётов ждали соединения с
# БД по 30 с и падали с 500 и 504. Ключ — один на весь сервер.
limit_conn_zone $server_addr zone=backend_conn:1m;
limit_conn_status 503;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
limit_req_status 429;
