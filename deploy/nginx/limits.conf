# Ограничение частоты запросов с одного адреса (уровень http, общий для HTTP- и HTTPS-сервера).
# Агенты: один прогон — 2 запроса (паки + результат) плюс досылка очереди; за одним NAT заказчика может
# быть сотня хостов, поэтому лимит щедрый, а защищает он от перебора ключей. Вход — от подбора пароля
# (на бэкенде своя блокировка учётной записи, это первый рубеж). Остальной API — от перегрузки.
limit_req_zone $binary_remote_addr zone=agents:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=600r/m;
limit_req_status 429;
