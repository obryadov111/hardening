# Общая часть сервера (HTTP: deploy/nginx.conf, HTTPS: deploy/nginx-tls.conf.template): статика
# собранного React-приложения, прокси /api и /health в бэкенд, лимиты частоты запросов.
server_tokens off;

root /usr/share/nginx/html;
index index.html;

client_max_body_size 50M;

# add_header в location отменяет унаследованные с уровня server — поэтому в location со своими заголовками
# они повторены. HSTS — через $hsts: задаёт сервер HTTPS, у HTTP пусто (пустой заголовок nginx не отправляет).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security $hsts always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Встроенный DNS Docker: имя бэкенда разрешается при каждом запросе, а не один раз при старте
# nginx — иначе после пересоздания hardening_backend (новый IP) прокси бил бы в старый адрес.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://hardening_backend:8000;

# proxy_pass с переменной передаёт исходный URI целиком (/api/...), как и ждёт бэкенд.
# X-Real-IP выставляется здесь и затирает присланный клиентом: бэкенд берёт из него адрес агента.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Пути агентов — открыты в интернет (только с ключом агента); прогон агента небольшой.
location = /api/ingest {
    limit_req zone=agents burst=60 nodelay;
    client_max_body_size 10M;
    proxy_pass $backend;
}
location = /api/agent/manifests {
    limit_req zone=agents burst=60 nodelay;
    proxy_pass $backend;
}
location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass $backend;
}
location /api/ {
    limit_req zone=api burst=200 nodelay;
    proxy_pass $backend;
    proxy_read_timeout 120s;  # выгрузка PDF/Excel
}

location = /health {
    proxy_pass $backend;
}

# Проверка владения доменом Let's Encrypt (deploy/enable_https.sh): файлы кладёт certbot на хосте.
location /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
}

# Файлы сборки Vite с хэшем в имени не меняются — кэшируются надолго. Каталог — /static/, а не
# стандартный /assets/: /assets/<id> — маршрут карточки актива в приложении (vite.config.js).
location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts always;
    try_files $uri =404;
}

# Маршруты React Router (/assets/<id>, /scans и т. п.) отдаются через index.html;
# сам index.html не кэшируется, чтобы после выкатки сразу подхватывалась новая сборка.
location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security $hsts always;
    try_files $uri /index.html;
}
