# Журнал доступа. Формат задаётся в http (этот файл подключается из conf.d раньше server).
# Нет заголовка X-Agent-Api-Key и нет тела запроса: ключ агента и отчёт в журнал не попадают.
# rt — время запроса у nginx, urt — время ответа upstream, ust — статус upstream
# (несколько значений через запятую, если upstream был не один), cr — номер запроса в соединении.
log_format hardening '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time ust=$upstream_status cr=$connection_requests';
