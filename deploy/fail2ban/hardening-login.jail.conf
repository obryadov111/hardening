# fail2ban: блокировка подбора пароля к сайту (фильтр hardening-login). Устанавливается deploy/enable_fail2ban.sh,
# адреса без блокировки (__IGNOREIP__) — из HARDENING_ADMIN_NETWORKS и внешнего адреса NAT (deploy/frontend.env).
#
# Опубликованные порты Docker обходят цепочку INPUT (и ufw): трафик к контейнеру идёт через FORWARD, поэтому
# бан — в DOCKER-USER, на все порты (после DNAT порт там уже порт контейнера, а не 443).
[hardening-login]
enabled   = true
backend   = systemd
filter    = hardening-login
# chain — переменной jail, а не параметром banaction: стандартное действие подставляет её поверх.
banaction = iptables-allports
chain     = DOCKER-USER
maxretry  = 10
findtime  = 10m
bantime   = 1h
bantime.increment = true
bantime.maxtime   = 1w
ignoreip  = 127.0.0.1/8 ::1 __IGNOREIP__
