# fail2ban: неудачные попытки входа на сайт (журнал nginx контейнера hardening_frontend в systemd-journal,
# deploy/restart_frontend.sh запускает его с --log-driver journald). Устанавливается deploy/enable_fail2ban.sh.
#
# Неверный пароль или код 2FA — 401, превышение лимита попыток входа в nginx — 429. Пути агентов не
# учитываются: за одним NAT заказчика бывает сотня агентов, их временные 429 не повод блокировать всех.
# Время в [..] fail2ban вырезает из строки до сравнения, поэтому выражение его не содержит. Из журнала
# строка приходит с префиксом «хост идентификатор:» — его снимает __prefix_line (common.conf).
[INCLUDES]
before = common.conf

[Definition]
failregex = ^%(__prefix_line)s<HOST> - \S+ [^"]*"POST /api/auth/(?:login|verify-2fa)[^"]*" (?:401|429) 
ignoreregex =
journalmatch = CONTAINER_NAME=hardening_frontend
