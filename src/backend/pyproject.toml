[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI DI: Depends(...)/Query(...) как default-значение — идиоматичный паттерн, не баг.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
# Голый `pytest tests/` (как в CI) должен находить пакеты app и tests без PYTHONPATH.
pythonpath = ["."]
testpaths = ["tests"]
# Устаревшее API (datetime.utcnow, модуль crypt в passlib) — ошибка теста, а не строчка в сводке:
# иначе оно копится до обновления Python или библиотеки, на котором ломается прод.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # starlette.testclient (0.47) обращается к anyio.abc.BlockingPortal — с anyio 4.15 это устаревший
    # псевдоним; чинится обновлением starlette, наш код ни при чём.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
