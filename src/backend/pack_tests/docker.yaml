# Образцы для пака docker: сокет демона и вывод `docker ps -q` / `docker inspect` по полям.
# Команды проходят тот же белый список агента, что и на хосте (LOCAL_COMMAND_POLICY).
pack: docker

base:
  files:
    /etc/os-release: "ID=ubuntu\n"
  stats:
    /var/run/docker.sock: "660"
  commands:
    docker ps -q: "a1b2c3d4e5f6\n"
    docker inspect --format {{.HostConfig.Privileged}} a1b2c3d4e5f6: "false\n"
    docker inspect --format {{.HostConfig.Binds}} a1b2c3d4e5f6: "[/srv/app/data:/data]\n"
    docker inspect --format {{.Config.User}} a1b2c3d4e5f6: "1000\n"
    docker inspect --format {{.HostConfig.Memory}} a1b2c3d4e5f6: "536870912\n"
    docker inspect --format {{.HostConfig.NanoCpus}} a1b2c3d4e5f6: "1000000000\n"
    docker inspect --format {{.HostConfig.NetworkMode}} a1b2c3d4e5f6: "bridge\n"
    docker inspect --format {{.HostConfig.PidMode}} a1b2c3d4e5f6: "\n"

cases:
  - name: безопасный контейнер — всё соблюдено
    detect: true
    expect:
      docker.no_privileged_containers: pass
      docker.no_sensitive_host_mounts: pass
      docker.no_root_user_explicit: pass
      docker.memory_limit_set: pass
      docker.cpu_limit_set: pass
      docker.no_host_network: pass
      docker.no_host_pid: pass

  - name: опасный контейнер рядом с безопасным — нарушено всё
    commands:
      docker ps -q: "a1b2c3d4e5f6\nfeedbeef0001\n"
      docker inspect --format {{.HostConfig.Privileged}} feedbeef0001: "true\n"
      docker inspect --format {{.HostConfig.Binds}} feedbeef0001: "[/var/run/docker.sock:/var/run/docker.sock /etc:/host/etc:ro]\n"
      docker inspect --format {{.Config.User}} feedbeef0001: "root\n"
      docker inspect --format {{.HostConfig.Memory}} feedbeef0001: "0\n"
      docker inspect --format {{.HostConfig.NanoCpus}} feedbeef0001: "0\n"
      docker inspect --format {{.HostConfig.NetworkMode}} feedbeef0001: "host\n"
      docker inspect --format {{.HostConfig.PidMode}} feedbeef0001: "host\n"
    expect:
      docker.no_privileged_containers: fail
      docker.no_sensitive_host_mounts: fail
      docker.no_root_user_explicit: fail
      docker.memory_limit_set: fail
      docker.cpu_limit_set: fail
      docker.no_host_network: fail
      docker.no_host_pid: fail

  - name: нет запущенных контейнеров — нарушений нет
    commands:
      docker ps -q: ""
    expect:
      docker.no_privileged_containers: pass
      docker.no_host_pid: pass

  - name: агенту не дали доступ к docker — «не проверено», а не «нарушений нет»
    commands:
      docker ps -q: { stderr: "permission denied while trying to connect to the Docker daemon socket", code: 1 }
    expect:
      docker.no_privileged_containers: error
      docker.no_sensitive_host_mounts: error
      docker.memory_limit_set: error

  - name: docker не установлен — пак не применяется
    drop: [/var/run/docker.sock]
    detect: false
