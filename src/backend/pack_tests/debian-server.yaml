# Образцы для пака debian-server. Проверки те же, что у ubuntu-server (генерируются из него), поэтому сценарии
# укреплённого/слабого хоста взяты из pack_tests/ubuntu-server.yaml с подменой /etc/os-release; сценарий «как
# поставляется» — реальные файлы, снятые с официального образа.
pack: debian-server
base:
  files:
    /etc/os-release: 'PRETTY_NAME="Debian GNU/Linux 12 (bookworm)"

      NAME="Debian GNU/Linux"

      VERSION_ID="12"

      ID=debian

      '
    /etc/ssh/sshd_config: 'PermitRootLogin no

      PasswordAuthentication no

      PermitEmptyPasswords no

      X11Forwarding no

      MaxAuthTries 4

      '
    /etc/ufw/ufw.conf: 'ENABLED=yes

      '
    /etc/default/ufw: 'DEFAULT_INPUT_POLICY="DROP"

      '
    /etc/apt/apt.conf.d/20auto-upgrades: 'APT::Periodic::Update-Package-Lists "1";

      APT::Periodic::Unattended-Upgrade "1";

      '
    /etc/login.defs: "PASS_MAX_DAYS\t90\nPASS_MIN_DAYS\t0\n"
    /etc/security/pwquality.conf: '# comment

      minlen = 14

      '
    /etc/pam.d/common-password: 'password requisite pam_pwquality.so retry=3

      password [success=1 default=ignore] pam_unix.so obscure use_authtok try_first_pass yescrypt

      '
    /etc/pam.d/common-auth: 'auth required pam_faillock.so preauth deny=5

      auth [success=1] pam_unix.so

      '
    /proc/sys/net/ipv4/ip_forward: '0

      '
  commands:
    ufw status verbose: 'Status: active

      Logging: on (low)

      Default: deny (incoming), allow (outgoing), disabled (routed)

      '
    systemctl is-active auditd: 'active

      '
cases:
- name: укреплённый хост — всё соблюдено
  detect: true
  expect:
    ssh.permit_root_login: pass
    ssh.password_authentication: pass
    ssh.permit_empty_passwords: pass
    ssh.x11_forwarding: pass
    ssh.max_auth_tries: pass
    firewall.ufw_enabled: pass
    firewall.default_incoming_policy: pass
    updates.unattended_upgrades_enabled: pass
    password_policy.pass_max_days: pass
    password_policy.pass_min_len: pass
    password_policy.pwquality_enabled: pass
    password_policy.lockout_on_failure: pass
    kernel.ip_forward: pass
    logging.auditd_active: pass
- name: слабый хост — нарушено всё
  files:
    /etc/ssh/sshd_config: 'PermitRootLogin yes

      PasswordAuthentication yes

      PermitEmptyPasswords yes

      X11Forwarding yes

      MaxAuthTries 6

      '
    /etc/ufw/ufw.conf: 'ENABLED=no

      '
    /etc/default/ufw: 'DEFAULT_INPUT_POLICY="ACCEPT"

      '
    /etc/apt/apt.conf.d/20auto-upgrades: 'APT::Periodic::Unattended-Upgrade "0";

      '
    /etc/login.defs: "PASS_MAX_DAYS\t99999\n"
    /etc/security/pwquality.conf: 'minlen = 8

      '
    /etc/pam.d/common-password: 'password [success=1 default=ignore] pam_unix.so obscure yescrypt

      '
    /etc/pam.d/common-auth: 'auth [success=1] pam_unix.so nullok

      '
    /proc/sys/net/ipv4/ip_forward: '1

      '
  commands:
    ufw status verbose: 'Status: inactive

      '
    systemctl is-active auditd:
      stdout: 'inactive

        '
      code: 3
  expect:
    ssh.permit_root_login: fail
    ssh.password_authentication: fail
    ssh.permit_empty_passwords: fail
    ssh.x11_forwarding: fail
    ssh.max_auth_tries: fail
    firewall.ufw_enabled: fail
    firewall.default_incoming_policy: fail
    updates.unattended_upgrades_enabled: fail
    password_policy.pass_max_days: fail
    password_policy.pass_min_len: fail
    password_policy.pwquality_enabled: fail
    password_policy.lockout_on_failure: fail
    kernel.ip_forward: fail
    logging.auditd_active: fail
- name: Debian 12 как поставляется (файлы сняты с официального образа 2026-09-27, установлены ufw/auditd/pwquality/unattended-upgrades)
  files:
    /etc/ssh/sshd_config: "Include /etc/ssh/sshd_config.d/*.conf\nKbdInteractiveAuthentication no\nUsePAM yes\nX11Forwarding yes\nPrintMotd no\nAcceptEnv LANG LC_*\nSubsystem\tsftp\t/usr/lib/openssh/sftp-server\n"
    /etc/login.defs: "PASS_MAX_DAYS\t99999\nPASS_MIN_DAYS\t0\n"
    /etc/security/pwquality.conf: '# minlen = 8

      '
    /etc/pam.d/common-auth: "auth\t[success=1 default=ignore]\tpam_unix.so nullok\nauth\trequisite\t\t\tpam_deny.so\nauth\trequired\t\t\tpam_permit.so\n"
    /etc/pam.d/common-password: "password\trequisite\t\t\tpam_pwquality.so retry=3\npassword\t[success=1 default=ignore]\tpam_unix.so obscure use_authtok try_first_pass yescrypt\npassword\trequisite\t\t\
      \tpam_deny.so\npassword\trequired\t\t\tpam_permit.so\n"
    /etc/ufw/ufw.conf: 'ENABLED=no

      '
    /etc/default/ufw: 'DEFAULT_INPUT_POLICY="DROP"

      '
    /etc/apt/apt.conf.d/20auto-upgrades: 'APT::Periodic::Update-Package-Lists "1";

      APT::Periodic::Unattended-Upgrade "1";

      '
  commands:
    ufw status verbose:
      stdout: ''
      stderr: 'ERROR: You need to be root to run this script'
      code: 1
  expect:
    ssh.permit_root_login: fail
    ssh.password_authentication: fail
    ssh.permit_empty_passwords: pass
    ssh.x11_forwarding: fail
    ssh.max_auth_tries: fail
    firewall.ufw_enabled: fail
    firewall.default_incoming_policy: pass
    updates.unattended_upgrades_enabled: pass
    password_policy.pass_max_days: fail
    password_policy.pass_min_len: fail
    password_policy.pwquality_enabled: pass
    password_policy.lockout_on_failure: fail
- name: агент без root — ufw status отказал, состояние берётся из файлов конфигурации
  commands:
    ufw status verbose:
      stdout: ''
      stderr: 'ERROR: You need to be root to run this script'
      code: 1
  expect:
    firewall.ufw_enabled: pass
    firewall.default_incoming_policy: pass
- name: параметры не заданы — действуют значения по умолчанию OpenSSH
  files:
    /etc/ssh/sshd_config: '# пусто: всё по умолчанию

      '
  expect:
    ssh.permit_root_login: fail
    ssh.password_authentication: fail
    ssh.permit_empty_passwords: pass
    ssh.max_auth_tries: fail
- name: pwquality.conf без minlen и pam_pwquality не подключён — две честные ошибки, не «не проверено»
  files:
    /etc/security/pwquality.conf: '# minlen = 8

      '
    /etc/pam.d/common-password: 'password [success=1 default=ignore] pam_unix.so obscure yescrypt

      # password requisite pam_pwquality.so

      '
  expect:
    password_policy.pass_min_len: fail
    password_policy.pwquality_enabled: fail
- name: нет файлов — «не проверено», а не «соблюдено»
  drop:
  - /etc/ssh/sshd_config
  - /etc/security/pwquality.conf
  expect:
    ssh.permit_root_login: error
    ssh.permit_empty_passwords: error
    password_policy.pass_min_len: error
- name: 'распознаётся: Debian 11'
  files:
    /etc/os-release: 'ID=debian

      VERSION_ID="11"

      '
  detect: true
- name: 'распознаётся: Debian 13'
  files:
    /etc/os-release: 'ID=debian

      VERSION_ID="13"

      '
  detect: true
- name: 'не распознаётся: Ubuntu 24.04 (у неё свой пак)'
  files:
    /etc/os-release: 'ID=ubuntu

      ID_LIKE=debian

      '
  detect: false
- name: 'не распознаётся: Astra Linux (свой пак)'
  files:
    /etc/os-release: 'ID=astra

      ID_LIKE=debian

      '
  detect: false
- name: 'не распознаётся: Rocky 9'
  files:
    /etc/os-release: 'ID="rocky"

      ID_LIKE="rhel centos fedora"

      '
  detect: false
