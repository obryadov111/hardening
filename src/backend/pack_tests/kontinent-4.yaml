# Образцы пака kontinent-4 1.1.0. Текст — тот, что агент строит из JSON ЦУС
# (show continent …). Лабораторная пара 4.2.1-653 прогоняется в agent/tests/test_continent4.py.
pack: kontinent-4
base:
  cli:
    show continent version: |
      product: continent
      hwserial: 4210001
      name: node-4210001
      update_version: 4.2.1-653
      mode: utm
      platform: CUSTOM_PLATFORM
    show continent password-policy: |
      object: passwordpolicy
      min_length: 12
      wrong_try_count: 5
      wrong_try_block: 900
      blocked_days: 0
      lockout: on
    show continent administrators: |
      login: admin
        enabled: yes
        primary: yes
        autocreated: yes
        role: Главный администратор

      login: auditor
        enabled: yes
        primary: no
        autocreated: no
        role: Аудитор
    show continent ssh: |
      is_enabled: no
      permitted_addresses: 0
      state: выключен
    show continent snmp: |
      is_enabled: no
      protocol: v2
      auth_type: -
      enc_type: -
      state: SNMP выключен
    show continent syslog: |
      remote: yes

cases:
  - name: политика усилена, версия 4.2.1-653 уходит в БДУ
    detect: true
    firmware: { name: "комплекс безопасности «континент». версия 4", version: "4.2.1-653" }
    expect:
      kontinent4.password_min_length: pass
      kontinent4.lockout_enabled: pass
      kontinent4.personal_admin_accounts: pass
      kontinent4.ssh_access_restricted: pass
      kontinent4.snmp_secure: pass
      kontinent4.remote_syslog: pass

  - name: заводски слабые пароли, один встроенный администратор, открытые SSH и SNMP, нет syslog
    cli:
      show continent password-policy: |
        object: passwordpolicy
        min_length: 4
        wrong_try_count: 0
        wrong_try_block: 0
        blocked_days: 0
        lockout: off
      show continent administrators: |
        login: admin
          enabled: yes
          primary: yes
          autocreated: yes
          role: Главный администратор
      show continent ssh: |
        is_enabled: yes
        permitted_addresses: 0
        state: включён без ограничения адресов
      show continent snmp: |
        is_enabled: yes
        protocol: v2
        auth_type: -
        enc_type: -
        state: SNMP v2 (сообщество)
      show continent syslog: |
        remote: no
    expect:
      kontinent4.password_min_length: fail
      kontinent4.lockout_enabled: fail
      kontinent4.personal_admin_accounts: fail
      kontinent4.ssh_access_restricted: fail
      kontinent4.snmp_secure: fail
      kontinent4.remote_syslog: fail

  - name: SSH ограничен адресами и SNMP v3 с SHA и AES тоже соблюдены
    cli:
      show continent ssh: |
        is_enabled: yes
        permitted_addresses: 1
        state: включён, адреса ограничены
      show continent snmp: |
        is_enabled: yes
        protocol: v3
        auth_type: SHA
        enc_type: AES
        state: SNMP v3: аутентификация SHA и шифрование AES
    expect:
      kontinent4.ssh_access_restricted: pass
      kontinent4.snmp_secure: pass
