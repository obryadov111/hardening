# Пак «Windows Server — контроллер домена Active Directory» (2016 / 2019 / 2022 / 2025).
# Распознаётся по ProductType = LanmanNt. Дополняет windows-server (он на контроллере тоже срабатывает):
# здесь только то, что есть лишь у контроллера домена, — службы каталога (подпись и привязка LDAP, Netlogon,
# DSRM), аудит каталога и Kerberos, состояние домена. Пункт методики ФСТЭК — ДИС.1 «Конфигурация домена».
#
# Состояние домена (проба win_ad): агент выполняет на контроллере свой встроенный сценарий PowerShell —
# чтение каталога по LDAP через ADSI, без модуля ActiveDirectory; манифест выбирает только имя сведения из
# закрытого списка. Группы определяются по SID, поэтому язык системы не важен. Счётчики учётных записей
# в свидетельстве дают до 10 имён. Отключённые учётные записи не считаются.
#
# maturity=draft: живого контроллера домена для проверки не было — пути реестра, GUID подкатегорий аудита
# и запросы к каталогу подтверждены только образцами (pack_tests/windows-dc.yaml) и документацией. На
# Windows Server 2025 умолчания подписи LDAP могли измениться (как у подписи SMB) — проверить на живой системе.
#
# Генерируется из pack_sources/windows.py — правки там, не здесь.

pack: windows-dc
version: 1.0.0
maturity: draft
tags:
- windows
- windows-dc
- active-directory
transport: local
asset_type: windows-server
detect:
- probe:
    type: reg_value
    key: HKLM\SYSTEM\CurrentControlSet\Control\ProductOptions
    value: ProductType
  equals: LanmanNt
checks:
- id: windc.ldap_signing_required
  title: Сервер LDAP требует подпись (LDAPServerIntegrity = 2)
  probe:
    type: reg_value
    key: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
    value: LDAPServerIntegrity
    default: '1'
  assert:
    op: eq
    value: 2
  severity: high
  remediation: 'Параметры безопасности: «Контроллер домена: требования к подписи для LDAP-сервера» = «Требовать подпись».'
  refs:
  - source: CIS Microsoft Windows Server Benchmark, профиль Domain Controller (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.9
- id: windc.ldap_channel_binding
  title: LDAPS требует привязку к каналу (LdapEnforceChannelBinding = 2)
  probe:
    type: reg_value
    key: HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
    value: LdapEnforceChannelBinding
    default: '0'
  assert:
    op: eq
    value: 2
  severity: medium
  remediation: 'Параметры безопасности: «Контроллер домена: требования к маркеру привязки канала LDAP-сервера» = «Всегда» (предварительно проверить по событию 3039, что клиенты её поддерживают).'
  refs:
  - source: CIS Microsoft Windows Server Benchmark, профиль Domain Controller (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.9
- id: windc.netlogon_full_secure_channel
  title: Netlogon требует защищённый канал для всех (защита от ZeroLogon, CVE-2020-1472)
  probe:
    type: reg_value
    key: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
    value: FullSecureChannelProtection
    default: '1'
  assert:
    op: eq
    value: 1
  severity: critical
  remediation: 'Netlogon\Parameters: FullSecureChannelProtection = 1 (или удалить значение — с обновления 02.2021 это режим принудительной защиты).'
  refs:
  - source: Microsoft, рекомендации по защите Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.15
- id: windc.netlogon_no_vulnerable_allowlist
  title: Нет исключений из защиты Netlogon (vulnerablechannelallowlist)
  probe:
    type: reg_value
    key: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
    value: vulnerablechannelallowlist
  assert:
    op: absent
  severity: high
  remediation: 'Групповая политика «Контроллер домена: разрешить уязвимые подключения защищённого канала Netlogon» — не задана; устройства из списка обновить или вывести из домена.'
  refs:
  - source: Microsoft, рекомендации по защите Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.15
- id: windc.machine_password_change_allowed
  title: Контроллер не запрещает смену паролей учётных записей компьютеров
  probe:
    type: reg_value
    key: HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
    value: RefusePasswordChange
    default: '0'
  assert:
    op: eq
    value: 0
  severity: low
  remediation: 'Параметры безопасности: «Контроллер домена: запретить изменение пароля учётных записей компьютера» = Отключён.'
  refs:
  - source: CIS Microsoft Windows Server Benchmark, профиль Domain Controller (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
- id: windc.dsrm_network_logon_disabled
  title: Учётная запись DSRM не входит по сети (DsrmAdminLogonBehavior = 0)
  probe:
    type: reg_value
    key: HKLM\SYSTEM\CurrentControlSet\Control\Lsa
    value: DsrmAdminLogonBehavior
    default: '0'
  assert:
    op: eq
    value: 0
  severity: high
  remediation: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa: DsrmAdminLogonBehavior = 0 (или удалить значение).'
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.6
- id: windc.audit_ds_changes
  title: 'Аудит изменений службы каталогов: успех'
  probe:
    type: win_auditpol
    subcategory: '{0CCE923C-69AE-11D9-BED3-505054503030}'
  assert:
    op: in
    value:
    - 1
    - 3
  severity: medium
  remediation: Расширенная политика аудита, «Доступ к DS» → «Аудит изменений службы каталогов» = Успех.
  refs:
  - source: CIS Microsoft Windows Server Benchmark, профиль Domain Controller (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.11
- id: windc.audit_ds_access
  title: 'Аудит доступа к службе каталогов: отказ'
  probe:
    type: win_auditpol
    subcategory: '{0CCE923B-69AE-11D9-BED3-505054503030}'
  assert:
    op: in
    value:
    - 2
    - 3
  severity: low
  remediation: Расширенная политика аудита, «Доступ к DS» → «Аудит доступа к службе каталогов» = Отказ.
  refs:
  - source: CIS Microsoft Windows Server Benchmark, профиль Domain Controller (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.11
- id: windc.audit_kerberos_authentication
  title: 'Аудит службы проверки подлинности Kerberos: успех и отказ'
  probe:
    type: win_auditpol
    subcategory: '{0CCE9242-69AE-11D9-BED3-505054503030}'
  assert:
    op: eq
    value: 3
  severity: medium
  remediation: Расширенная политика аудита, «Вход учётной записи» → «Аудит службы проверки подлинности Kerberos» = Успех и отказ.
  refs:
  - source: CIS Microsoft Windows Server Benchmark, профиль Domain Controller (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.11
- id: windc.audit_kerberos_service_tickets
  title: 'Аудит операций с билетами службы Kerberos: успех и отказ'
  probe:
    type: win_auditpol
    subcategory: '{0CCE9240-69AE-11D9-BED3-505054503030}'
  assert:
    op: eq
    value: 3
  severity: low
  remediation: Расширенная политика аудита, «Вход учётной записи» → «Аудит операций с билетами службы Kerberos» = Успех и отказ.
  refs:
  - source: CIS Microsoft Windows Server Benchmark, профиль Domain Controller (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.11
- id: windc.audit_computer_account_management
  title: 'Аудит управления учётными записями компьютеров: успех'
  probe:
    type: win_auditpol
    subcategory: '{0CCE9236-69AE-11D9-BED3-505054503030}'
  assert:
    op: in
    value:
    - 1
    - 3
  severity: low
  remediation: Расширенная политика аудита, «Управление учётными записями» → «Аудит управления учётными записями компьютеров» = Успех.
  refs:
  - source: CIS Microsoft Windows Server Benchmark, профиль Domain Controller (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.11
- id: windc.krbtgt_password_rotated
  title: Пароль krbtgt менялся не позднее 180 дней назад
  probe:
    type: win_ad
    fact: krbtgt_password_age_days
  assert:
    op: lte
    value: 180
  severity: high
  remediation: Сменить пароль krbtgt дважды с интервалом не меньше времени репликации (сценарий Microsoft New-KrbtgtKeys.ps1); после компрометации домена — обязательно.
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Microsoft, рекомендации по защите Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.2
- id: windc.privileged_users_limited
  title: Не более 5 учётных записей с правами администратора домена или леса
  probe:
    type: win_ad
    fact: privileged_users_count
  assert:
    op: lte
    value: 5
  severity: medium
  remediation: 'Пересмотреть состав групп «Администраторы домена», «Администраторы предприятия», «Администраторы схемы», «Администраторы» (включая вложенные): для повседневной работы — отдельные учётные
    записи без этих прав.'
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Microsoft, рекомендации по защите Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.6
- id: windc.schema_admins_empty
  title: Группа «Администраторы схемы» пуста
  probe:
    type: win_ad
    fact: schema_admins_count
  assert:
    op: eq
    value: 0
  severity: medium
  remediation: Добавлять в «Администраторы схемы» только на время изменения схемы, затем удалять.
  refs:
  - source: Microsoft, рекомендации по защите Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.6
- id: windc.privileged_without_spn
  title: У привилегированных учётных записей нет SPN (не подвержены Kerberoasting)
  probe:
    type: win_ad
    fact: privileged_spn_users_count
  assert:
    op: eq
    value: 0
  severity: high
  remediation: Снять SPN с привилегированных учётных записей; службам — отдельные учётные записи (лучше gMSA) без административных прав.
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.6
- id: windc.no_unconstrained_delegation
  title: Нет учётных записей с неограниченным делегированием (кроме контроллеров домена)
  probe:
    type: win_ad
    fact: unconstrained_delegation_count
  assert:
    op: eq
    value: 0
  severity: high
  remediation: 'Свойства учётной записи → «Делегирование»: заменить «Доверять для делегирования любой службе» на ограниченное делегирование.'
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Microsoft, рекомендации по защите Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.6
- id: windc.no_asrep_roastable
  title: Нет учётных записей без предварительной проверки подлинности Kerberos (AS-REP roasting)
  probe:
    type: win_ad
    fact: asrep_roastable_count
  assert:
    op: eq
    value: 0
  severity: high
  remediation: 'Свойства учётной записи → «Учётная запись»: снять «Без предварительной проверки подлинности Kerberos».'
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.2
- id: windc.no_password_not_required
  title: Нет учётных записей, которым разрешён пустой пароль (PASSWD_NOTREQD)
  probe:
    type: win_ad
    fact: password_not_required_count
  assert:
    op: eq
    value: 0
  severity: high
  remediation: Снять признак PASSWD_NOTREQD (userAccountControl, флаг 32) и задать пароль.
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.2
- id: windc.no_reversible_encryption_users
  title: Нет учётных записей с хранением пароля обратимым шифрованием
  probe:
    type: win_ad
    fact: reversible_encryption_users_count
  assert:
    op: eq
    value: 0
  severity: high
  remediation: 'Свойства учётной записи: снять «Хранить пароль, используя обратимое шифрование», затем сменить пароль.'
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.2
- id: windc.no_des_only_users
  title: Нет учётных записей, ограниченных шифрованием DES в Kerberos
  probe:
    type: win_ad
    fact: des_only_users_count
  assert:
    op: eq
    value: 0
  severity: medium
  remediation: 'Свойства учётной записи: снять «Использовать только типы шифрования Kerberos DES», затем сменить пароль.'
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.9
- id: windc.no_password_never_expires
  title: Нет активных учётных записей с бессрочным паролем
  probe:
    type: win_ad
    fact: password_never_expires_count
  assert:
    op: eq
    value: 0
  severity: medium
  remediation: Снять «Срок действия пароля не ограничен»; учётные записи служб перевести на gMSA. Оставшиеся исключения — принятым риском.
  refs:
  - source: ANSSI, контрольные точки безопасности Active Directory (адаптировано)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ДИС.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.2
- id: windc.machine_account_quota_zero
  title: Обычные пользователи не могут добавлять компьютеры в домен (ms-DS-MachineAccountQuota = 0)
  probe:
    type: win_ad
    fact: machine_account_quota
  assert:
    op: eq
    value: 0
  severity: medium
  remediation: Set-ADDomain -Replace @{'ms-DS-MachineAccountQuota'=0}; присоединение к домену — делегированием на подразделение.
