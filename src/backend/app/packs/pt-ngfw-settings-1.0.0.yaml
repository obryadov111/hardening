# Пак «PT NGFW — настройки в системе управления» (Positive Technologies). Проверка ПО ОПРОСУ.
#
# Пак pt-ngfw (transport: ssh) распознаёт устройство и берёт версию для БДУ, но CLI PT NGFW только
# операционный: правила, учётные записи, SNMP и журналы задаются в веб-интерфейсе системы управления (и API,
# список методов которого публикуется только на самой системе управления). Этот пак — вопросы по экранам системы
# управления.
#
# maturity: draft — вопросы составлены по справочному порталу PT NGFW 1.11 (help.ptsecurity.com): «Вход в PT NGFW»,
# «Управление учетными записями», «Ролевая модель», «SNMP-мониторинг» (v2c и v3), «Работа с журналами»
# (сборщики журналов, журнал «Аудит»), «Операционные команды» (правило «Allow any» в примере). Ответы на живом
# устройстве не сверялись.

pack: pt-ngfw-settings
version: 1.0.0
maturity: draft
tags: [network-device, firewall, positive-technologies, pt-ngfw]
transport: manual
asset_type: network-device

firmware:
  vendor: Positive Technologies
  product: pt ngfw
  version_probe:
    type: manual
    answer: text
    question: Версия PT NGFW (Product version, например 1.11.0)
    hint: "CLI узла: show version → Product version; или система управления → страница устройства"

checks:
  - id: pt_ngfw.no_allow_any_rule
    title: Нет разрешающего правила «любой — любой — любой сервис»
    probe:
      type: manual
      question: В политиках безопасности всех виртуальных контекстов нет правила с действием «Разрешить», где источник, назначение и сервис/приложение — «любой» (например, «Allow any»)?
      hint: "Система управления → Политики → правила безопасности; в CLI узла: enter context <имя>, show security-rule — список имён правил"
    assert: { op: eq, value: "yes" }
    severity: critical
    remediation: "Заменить правило any-any правилами по конкретным сетям, сервисам и приложениям; в конце политики — запрещающее правило с журналированием."
    refs:
      - { source: "PT NGFW 1.11: Работа с правилами межсетевого экрана; Операционные команды (show security-rule)" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.2" }

  - id: pt_ngfw.personal_accounts
    title: Администраторы работают под персональными учётными записями с ролями, а не под admin
    probe:
      type: manual
      question: У каждого администратора своя учётная запись с ролью по задачам, а встроенная системная учётная запись admin для повседневной работы не используется?
      hint: "Система управления → Параметры → Администраторы; роли — раздел «Ролевая модель»"
    assert: { op: eq, value: "yes" }
    severity: medium
    remediation: "Создать персональные учётки (локальный пароль, LDAP или RADIUS) с минимально нужной ролью; admin — только для аварийного доступа."
    refs:
      - { source: "PT NGFW 1.11: Управление учетными записями; Ролевая модель" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.5" }

  - id: pt_ngfw.central_auth
    title: Аутентификация администраторов через LDAP или RADIUS
    probe:
      type: manual
      question: Администраторы входят через LDAP или RADIUS (агент Identity Control), а не только по локальным паролям?
      hint: "Система управления → Параметры → Администраторы → тип аутентификации; настройка агента Identity Control"
    assert: { op: eq, value: "yes" }
    severity: low
    remediation: "Настроить LDAP/RADIUS в агенте Identity Control и перевести учётки администраторов на этот тип аутентификации."
    refs:
      - { source: "PT NGFW 1.11: Управление учетными записями; Настройка агента Identity Control" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.4" }

  - id: pt_ngfw.snmp_v3
    title: SNMP-агент выключен или работает по SNMPv3
    probe:
      type: manual
      answer: choice
      choices: ["выключен", "SNMPv3", "SNMPv2c"]
      question: Как настроен SNMP-агент устройства (кластера)?
      hint: "Система управления → страница устройства или кластера → вкладка SNMP → «Общие» (состояние) и параметры SNMPv2c/SNMPv3"
    assert: { op: in, value: ["выключен", "SNMPv3"] }
    severity: medium
    remediation: "Перейти на SNMPv3 с аутентификацией и шифрованием или выключить SNMP-агент."
    refs:
      - { source: "PT NGFW 1.11: SNMP-мониторинг" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.8" }

  - id: pt_ngfw.log_collector
    title: События устройства передаются сборщику журналов (основному и резервному)
    probe:
      type: manual
      question: Для устройства назначен сборщик журналов (лучше основной и резервный, внешний — для централизованного хранения)?
      hint: "Система управления → Журналы → Настройка сборщиков журналов"
    assert: { op: eq, value: "yes" }
    severity: low
    remediation: "Назначить основной и резервный сборщики журналов; при наличии SIEM — передача syslog."
    refs:
      - { source: "PT NGFW 1.11: Работа с журналами; Настройка сборщиков журналов" }
