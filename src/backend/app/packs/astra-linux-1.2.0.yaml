# Пак «Astra Linux Special Edition»: 1.8 (сверено на официальном образе 1.8.6 из registry.astralinux.ru).
# Распознаётся по вхождению «astra» в ID/NAME/PRETTY_NAME /etc/os-release (на 1.8.6 — ID=astra).
#
# 1.1.0 (2026-09-27): было «только обнаружение» (1.0.0, проверок нет — без реального образа их нельзя было
# писать). Образ появился: общие для Debian проверки подтверждены на настоящих файлах Astra 1.8.6 — раскладка
# та же, что у Ubuntu/Debian (common-auth, common-password, sshd_config, login.defs, pwquality.conf, ufw,
# 20auto-upgrades). Проверки генерируются из ubuntu-server 1.4.0 (pack_sources/debian_family.py).
# Особенности Astra, замеченные на образе: пароли хэшируются ГОСТ (gost12_512 в common-password),
# pam_pwquality подключён по умолчанию, ufw и автообновления установлены и настроены как в Ubuntu.
#
# НЕ проверяются собственные механизмы защиты Astra: мандатный контроль целостности (МКЦ), мандатное
# управление доступом (МРД), замкнутая программная среда (ЗПС), режимы защищённости — они работают в ядре
# (parsec) и в контейнере не наблюдаемы; команды их проверки пишутся по руководству вендора на реальной
# установке, не по памяти. Это следующий шаг, для него нужна виртуальная машина Astra.
#
# maturity=draft: агент выполнен в контейнере Astra 1.8.6 — пак распознан, файловые пробы выполняются;
# службы без systemd не подтверждены.

pack: astra-linux
version: 1.2.0
maturity: draft
tags:
- linux-server
- debian-family
- astra
transport: local
asset_type: linux-server
detect:
- probe:
    type: file_regex
    path: /etc/os-release
    pattern: '(?im)^(?:ID|NAME|PRETTY_NAME)="?([^"

      ]*astra[^"

      ]*)'
  regex: (?i)astra
checks:
- id: ssh.permit_root_login
  title: Запрет входа по SSH под root
  probe:
    type: file_kv
    path: /etc/ssh/sshd_config
    key: PermitRootLogin
    follow_include: true
    default: prohibit-password
  assert:
    op: eq
    value: 'no'
  severity: high
  remediation: В sshd_config установить PermitRootLogin no и перезапустить sshd.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.10
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.1
- id: ssh.password_authentication
  title: Запрет входа по SSH-паролю (только по ключу)
  probe:
    type: file_kv
    path: /etc/ssh/sshd_config
    key: PasswordAuthentication
    follow_include: true
    default: 'yes'
  assert:
    op: eq
    value: 'no'
  severity: high
  remediation: В sshd_config установить PasswordAuthentication no.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.10
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.1
- id: ssh.permit_empty_passwords
  title: Запрет пустых паролей по SSH
  probe:
    type: file_kv
    path: /etc/ssh/sshd_config
    key: PermitEmptyPasswords
    follow_include: true
    default: 'no'
  assert:
    op: eq
    value: 'no'
  severity: critical
  remediation: В sshd_config установить PermitEmptyPasswords no.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.1
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.1
- id: ssh.x11_forwarding
  title: Отключить X11-форвардинг по SSH
  probe:
    type: file_kv
    path: /etc/ssh/sshd_config
    key: X11Forwarding
    follow_include: true
    default: 'no'
  assert:
    op: eq
    value: 'no'
  severity: low
  remediation: В sshd_config установить X11Forwarding no.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.15
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.4
- id: ssh.max_auth_tries
  title: Ограничить число попыток аутентификации SSH
  probe:
    type: file_kv
    path: /etc/ssh/sshd_config
    key: MaxAuthTries
    follow_include: true
    default: '6'
  assert:
    op: lte
    value: 4
  severity: medium
  remediation: В sshd_config установить MaxAuthTries 4 (или меньше).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.4
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.4
- id: firewall.ufw_enabled
  title: Firewall (ufw) активен
  probe:
    type: first_of
    probes:
    - type: cmd_regex
      cmd:
      - ufw
      - status
      - verbose
      pattern: (?i)Status:\s*(active|inactive)
    - type: file_kv
      path: /etc/ufw/ufw.conf
      key: ENABLED
      separator: equals
  assert:
    op: in
    value:
    - active
    - 'yes'
  severity: high
  remediation: Выполнить `ufw enable` и проверить `ufw status`.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.10
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.2
- id: firewall.default_incoming_policy
  title: Политика по умолчанию для входящих — deny
  probe:
    type: first_of
    probes:
    - type: cmd_regex
      cmd:
      - ufw
      - status
      - verbose
      pattern: (?i)Default:\s*(deny|allow|reject)\s*\(incoming\)
    - type: file_kv
      path: /etc/default/ufw
      key: DEFAULT_INPUT_POLICY
      separator: equals
  assert:
    op: in
    value:
    - deny
    - reject
    - drop
  severity: high
  remediation: Выполнить `ufw default deny incoming`.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.10
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.2
- id: updates.unattended_upgrades_enabled
  title: Автоматические обновления безопасности включены
  probe:
    type: file_regex
    path: /etc/apt/apt.conf.d/20auto-upgrades
    pattern: Unattended-Upgrade\s+"(\d)"
  assert:
    op: eq
    value: '1'
  severity: medium
  remediation: Установить и настроить unattended-upgrades (`dpkg-reconfigure -plow unattended-upgrades`).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.2
- id: password_policy.pass_max_days
  title: Максимальный срок действия пароля — не более 90 дней
  probe:
    type: file_kv
    path: /etc/login.defs
    key: PASS_MAX_DAYS
  assert:
    op: lte
    value: 90
  severity: medium
  remediation: В /etc/login.defs установить PASS_MAX_DAYS 90 (или меньше).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.2
- id: password_policy.pass_min_len
  title: Минимальная длина пароля — не менее 14 символов
  probe:
    type: file_kv
    path: /etc/security/pwquality.conf
    key: minlen
    separator: equals
    default: '8'
  assert:
    op: gte
    value: 14
  severity: medium
  remediation: В /etc/security/pwquality.conf установить minlen=14 (или больше).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.2
- id: password_policy.pwquality_enabled
  title: Проверка сложности паролей (pam_pwquality) подключена к PAM
  probe:
    type: file_regex
    path: /etc/pam.d/common-password
    pattern: ^[^#\n]*\b(pam_pwquality)\.so
  assert:
    op: exists
  severity: medium
  remediation: Установить libpam-pwquality (`apt install libpam-pwquality`) и проверить строку `password requisite pam_pwquality.so` в /etc/pam.d/common-password.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.2
- id: password_policy.lockout_on_failure
  title: Блокировка после неудачных попыток входа
  probe:
    type: file_regex
    path: /etc/pam.d/common-auth
    pattern: ^[^#\n]*\b(pam_faillock|pam_tally2)\b
  assert:
    op: exists
  severity: high
  remediation: Настроить pam_faillock (deny=5, unlock_time=900).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.4
- id: kernel.ip_forward
  title: IP-форвардинг отключён (хост не является роутером)
  probe:
    type: file_regex
    path: /proc/sys/net/ipv4/ip_forward
    pattern: ^\s*(\d)
  assert:
    op: eq
    value: '0'
  severity: low
  remediation: Установить net.ipv4.ip_forward=0 в /etc/sysctl.conf и применить `sysctl -p`.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.15
- id: logging.auditd_active
  title: Аудит событий безопасности (auditd) активен
  probe:
    type: service_state
    service: auditd
    field: active
  assert:
    op: eq
    value: active
  severity: high
  remediation: Установить пакет auditd (`apt install auditd`) и включить службу (`systemctl enable --now auditd`).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.11
- id: accounts.pam_nullok_absent
  title: PAM не разрешает вход с пустым паролем (нет nullok)
  probe:
    type: file_regex
    path: /etc/pam.d/common-auth
    pattern: ^[^#\n]*\bpam_unix\.so\b[^\n]*\b(nullok)\b
  assert:
    op: absent
  severity: high
  remediation: Убрать nullok из строки pam_unix.so в /etc/pam.d/common-auth (предварительно убедиться, что учёток с пустым паролем нет).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.1
- id: mac.apparmor_enabled
  title: Мандатное управление доступом (AppArmor) включено
  probe:
    type: file_regex
    path: /sys/module/apparmor/parameters/enabled
    pattern: ^\s*([YN])
  assert:
    op: eq
    value: Y
  severity: medium
  remediation: Не отключать AppArmor (параметр ядра apparmor=0); `systemctl enable --now apparmor`.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.3
- id: accounts.uid0_only_root
  title: Права суперпользователя (UID 0) только у root
  probe:
    type: file_regex
    path: /etc/passwd
    pattern: '^(?!root:)([^:\n]+):[^:\n]*:0:'
  assert:
    op: absent
  severity: critical
  remediation: Сменить UID у найденной учётки или удалить её (`usermod -u <новый UID> <учётка>`).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.6
- id: files.shadow_permissions
  title: Права на /etc/shadow не шире 640
  probe:
    type: file_stat
    path: /etc/shadow
    field: mode
  assert:
    op: mode_within
    value: '640'
  severity: high
  remediation: chown root:shadow /etc/shadow && chmod 640 /etc/shadow
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.7
- id: files.passwd_permissions
  title: Права на /etc/passwd не шире 644
  probe:
    type: file_stat
    path: /etc/passwd
    field: mode
  assert:
    op: mode_within
    value: '644'
  severity: medium
  remediation: chown root:root /etc/passwd && chmod 644 /etc/passwd
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.7
- id: services.telnet_inactive
  title: Сервер Telnet не работает
  probe:
    type: service_state
    service: inetd
  assert:
    op: ne
    value: active
  severity: high
  remediation: apt purge inetutils-telnetd telnetd openbsd-inetd; удалённый доступ — только по SSH.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.8
- id: services.rsh_inactive
  title: Службы rsh/rlogin не работают
  probe:
    type: service_state
    service: rsh.socket
  assert:
    op: ne
    value: active
  severity: high
  remediation: apt purge rsh-server rsh-redone-server.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.8
- id: services.ftp_inactive
  title: FTP-сервер (vsftpd) не работает
  probe:
    type: service_state
    service: vsftpd
  assert:
    op: ne
    value: active
  severity: medium
  remediation: Передавать файлы по SFTP; FTP-сервер удалить (`apt purge vsftpd`).
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.8
- id: ssh.no_weak_ciphers
  title: SSH не разрешает устаревшие шифры (CBC, 3DES, RC4)
  probe:
    type: file_kv
    path: /etc/ssh/sshd_config
    key: Ciphers
    follow_include: true
    default: по умолчанию OpenSSH
  assert:
    op: regex
    value: ^(?!.*(cbc|3des|arcfour|blowfish|cast128)).*$
  severity: medium
  remediation: Убрать из Ciphers в sshd_config алгоритмы *-cbc, 3des-cbc, arcfour*; или не задавать Ciphers.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.9
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.3
- id: ssh.no_weak_macs
  title: SSH не разрешает устаревшие MAC (MD5, SHA-1, 64-битные)
  probe:
    type: file_kv
    path: /etc/ssh/sshd_config
    key: MACs
    follow_include: true
    default: по умолчанию OpenSSH
  assert:
    op: regex
    value: ^(?!.*(md5|sha1|umac-64|ripemd)).*$
  severity: medium
  remediation: Убрать из MACs в sshd_config hmac-md5*, hmac-sha1, umac-64*; или не задавать MACs.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.9
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: СУД.1.3
- id: kernel.usb_storage_disabled
  title: Модуль USB-накопителей (usb-storage) запрещён
  probe:
    type: cmd_regex
    cmd:
    - modprobe
    - -n
    - -v
    - usb-storage
    pattern: ^\s*install\s+(/bin/(?:false|true)|/usr/bin/(?:false|true))
  assert:
    op: exists
  severity: low
  remediation: echo 'install usb-storage /bin/false' > /etc/modprobe.d/usb-storage.conf; rmmod usb-storage.
  refs:
  - source: CIS Debian Linux Benchmark (адаптировано; Astra Linux основана на Debian)
  - source: Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025
    id: ОПС.1.13
