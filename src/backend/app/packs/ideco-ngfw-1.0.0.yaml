# Пак «Ideco NGFW» (ООО «Айдеко»): межсетевой экран нового поколения. Проверка ПО ОПРОСУ: настройки задаются
# в веб-интерфейсе, команд просмотра конфигурации и её выгрузки в текстовом виде документация не описывает.
#
# Что Ideco обеспечивает сам и здесь не спрашивается (документация «Администраторы», v20): пароль локального
# администратора — не короче 12 символов, буквы разных регистров, цифры и спецсимволы; после шести неудачных
# попыток входа доступ блокируется; сессия администратора ограничена 24 часами.
#
# maturity: draft — вопросы составлены по документации docs.ideco.ru (v20: «Администраторы», «Доступ к
# веб-интерфейсу из внешней сети и удаленный доступ по SSH», «Роли администраторов»), ответы на живом
# NGFW не сверялись.

pack: ideco-ngfw
version: 1.0.0
maturity: draft
tags: [network-device, firewall, ideco, ideco-ngfw]
transport: manual
asset_type: network-device

# Версия ПО — для сопоставления с БДУ ФСТЭК (УСИ.1): в БДУ продукт «Межсетевой экран «Ideco UTM»» (версии до 19.x;
# Ideco NGFW — продолжение линейки).
firmware:
  vendor: ООО «Айдеко»
  product: межсетевой экран «ideco utm»
  version_probe:
    type: manual
    answer: text
    question: Версия Ideco NGFW (например, 20.3)
    hint: "Веб-интерфейс → Мониторинг / Управление сервером (версия в заголовке или разделе «Обновления»)"

checks:
  - id: ideco_ngfw.web_external_access
    title: Веб-интерфейс управления недоступен из внешней сети
    probe:
      type: manual
      question: Выключена ли опция «Доступ к веб-интерфейсу из внешней сети»?
      hint: "Управление сервером → Администраторы → «Доступ к веб-интерфейсу из внешней сети и удаленный доступ по SSH»"
    assert: { op: eq, value: "yes" }
    severity: high
    remediation: "Выключить доступ к веб-интерфейсу из внешней сети; удалённое управление — через VPN или Ideco Center."
    refs:
      - { source: "Ideco NGFW v20: Администраторы", id: "Доступ к веб-интерфейсу из внешней сети" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.5" }

  - id: ideco_ngfw.ssh_external_access
    title: SSH из внешней сети выключен
    probe:
      type: manual
      question: Выключен ли удалённый доступ по SSH из внешних сетей?
      hint: "Управление сервером → Администраторы → опции удалённого доступа по SSH (порт 22)"
    assert: { op: eq, value: "yes" }
    severity: high
    remediation: "Выключить SSH из внешних сетей; при необходимости — только из локальной сети администраторов."
    refs:
      - { source: "Ideco NGFW v20: Администраторы", id: "Удаленный доступ по SSH" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.5" }

  - id: ideco_ngfw.ssh_local_access
    title: SSH из локальной сети включён только при необходимости
    probe:
      type: manual
      answer: choice
      choices: ["выключен", "включён, используется администраторами", "включён, не используется"]
      question: Как используется доступ по SSH из локальной сети?
      hint: "Управление сервером → Администраторы → опции удалённого доступа по SSH"
    assert: { op: in, value: ["выключен", "включён, используется администраторами"] }
    severity: low
    remediation: "Выключить SSH из локальной сети, если он не нужен для обслуживания."
    refs:
      - { source: "Ideco NGFW v20: Администраторы", id: "Удаленный доступ по SSH" }

  - id: ideco_ngfw.personal_admins
    title: Администраторы работают под персональными учётными записями с ролями
    probe:
      type: manual
      question: У каждого администратора своя учётная запись (локальная, AD/ALD/FreeIPA или RADIUS) с ролью по задачам, общих учёток нет?
      hint: "Управление сервером → Администраторы (вкладки «Локальные», AD/ALD/FreeIPA, RADIUS) и «Роли администраторов»"
    assert: { op: eq, value: "yes" }
    severity: medium
    remediation: "Создать персональные учётки; роль «Администратор» — только тем, кому нужна полная настройка; остальным — «Только просмотр», «Администратор файрвола» и т. п."
    refs:
      - { source: "Ideco NGFW v20: Администраторы", id: "Роли администраторов" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.5" }

  - id: ideco_ngfw.central_admin_auth
    title: Администраторы проходят аутентификацию через AD/ALD/FreeIPA или RADIUS
    probe:
      type: manual
      question: Интегрированы ли администраторы с AD/ALD Pro/FreeIPA или RADIUS (централизованное управление учётками)?
      hint: "Управление сервером → Администраторы → вкладки AD/ALD/FreeIPA и RADIUS"
    assert: { op: eq, value: "yes" }
    severity: low
    remediation: "Подключить администраторов через группу безопасности домена или RADIUS (атрибут Ideco-Administrator-Role)."
    refs:
      - { source: "Ideco NGFW v20: Администраторы", id: "Управление AD/ALD/FreeIPA и RADIUS-администраторами" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.4" }

  - id: ideco_ngfw.remote_syslog
    title: Журналы отправляются на внешний syslog-сервер или в SIEM
    probe:
      type: manual
      question: Настроена ли отправка журналов на внешний syslog-сервер или в SIEM?
      hint: "Мониторинг → Журналы / Syslog (раздел отправки журналов)"
    assert: { op: eq, value: "yes" }
    severity: low
    remediation: "Настроить отправку журналов на syslog-сервер или в SIEM."
    refs:
      - { source: "Ideco NGFW: документация, раздел журналирования" }
