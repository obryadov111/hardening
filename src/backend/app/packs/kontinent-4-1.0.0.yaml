# Пак «Континент 4» (ООО «Код Безопасности»): комплекс безопасности — NGFW, криптошлюз, СОВ. Проверка ПО ОПРОСУ.
#
# Почему опрос. Настройки узлов безопасности (УБ) хранятся в центре управления сетью (ЦУС) и меняются только
# в графическом Менеджере конфигурации (МК); по SSH доступно лишь текстовое локальное меню УБ (и только если
# доступ явно включён), команды show нет, выгрузки конфигурации в файл документация не описывает. Поэтому вопросы
# формулируются по экранам МК и локального меню — у каждого указано, где смотреть, — а отвечает аудитор.
#
# maturity: draft — вопросы составлены по документации, на живом комплексе ответы не сверялись.
# Источник: «Континент 4.2.1», портал документации docs.securitycode.ru: «Политика безопасности учетных записей»,
# «Дистанционный доступ по протоколу SSH», «Настройка тайм-аута неактивности», «Контроль узлов безопасности по
# протоколу SNMP», «Отправка журналов на syslog-сервер», «Смена пароля доступа к локальному меню», «Смена пароля
# для входа в меню установки BIOS», «Администрирование комплекса» (роли).
#
# Заводские пароли из документации: BIOS — 123456; загрузчик (доступ к локальному меню) после обновления
# комплекса — Passgrub.1 («его необходимо сменить»).

pack: kontinent-4
version: 1.0.0
maturity: draft
tags: [network-device, security-gateway, firewall, securitycode, kontinent-4]
transport: manual
asset_type: network-device

# Версия ПО — для сопоставления с БДУ ФСТЭК (УСИ.1): в БДУ продукт «Комплекс безопасности «Континент». Версия 4».
firmware:
  vendor: ООО «Код Безопасности»
  product: комплекс безопасности «континент». версия 4
  version_probe:
    type: manual
    answer: text
    question: Версия ПО узла безопасности (например, 4.2.1)
    hint: "МК → «Структура» → узел безопасности → «Свойства» (или главное меню локального управления УБ)"

checks:
  - id: kontinent4.loader_password_changed
    title: Пароль доступа к локальному меню (загрузчика) сменён, заводской Passgrub.1 не используется
    probe:
      type: manual
      question: Пароль загрузчика для доступа к локальному меню сменён после установки и после последнего обновления комплекса?
      hint: "Локальное меню УБ → «Настройки | Настройки загрузчика». После обновления устанавливается пароль по умолчанию Passgrub.1"
    assert: { op: eq, value: "yes" }
    severity: critical
    remediation: "Сменить пароль в «Настройки | Настройки загрузчика» на каждом УБ, в том числе после каждого обновления ПО."
    refs:
      - { source: "Континент 4.2.1: Смена пароля доступа к локальному меню" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.3" }

  - id: kontinent4.bios_password_changed
    title: Пароль BIOS узла безопасности сменён (не заводской 123456)
    probe:
      type: manual
      question: Пароль входа в меню установки BIOS узла безопасности отличается от заводского 123456?
      hint: "При загрузке УБ — вход в BIOS (<Del>, <F1> или <F2>), вкладка Security"
    assert: { op: eq, value: "yes" }
    severity: high
    remediation: "Сменить пароль администратора BIOS на каждом УБ (раздел «Смена пароля для входа в меню установки BIOS»)."
    refs:
      - { source: "Континент 4.2.1: Смена пароля для входа в меню установки BIOS" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.3" }

  - id: kontinent4.password_min_length
    title: Минимальная длина пароля администраторов не меньше 8 символов
    probe:
      type: manual
      answer: number
      unit: символов
      question: Какая минимальная длина пароля задана в политике безопасности учётных записей?
      hint: "МК → «Администрирование» → «Администраторы» → кнопка «Политика безопасности учетных записей»"
    assert: { op: gte, value: 8 }
    severity: medium
    remediation: "Задать в политике безопасности учётных записей минимальную длину пароля не меньше 8 (лучше 12) и требования к сложности."
    refs:
      - { source: "Континент 4.2.1: Политика безопасности учетных записей" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.4" }

  - id: kontinent4.lockout_enabled
    title: Включена автоматическая блокировка после неверных попыток входа
    probe:
      type: manual
      question: На вкладке «Параметры входа» политики безопасности учётных записей включена автоматическая блокировка после ввода неверного пароля?
      hint: "МК → «Администрирование» → «Администраторы» → «Политика безопасности учетных записей» → «Параметры входа». Блокировка действует для МК, локального меню, SSH, сервера доступа, портала аутентификации"
    assert: { op: eq, value: "yes" }
    severity: medium
    remediation: "Включить автоматическую блокировку (например, после 5 попыток на 15 минут)."
    refs:
      - { source: "Континент 4.2.1: Политика безопасности учетных записей" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.6" }

  - id: kontinent4.personal_admin_accounts
    title: Администраторы работают под персональными учётными записями с ролями
    probe:
      type: manual
      question: Администраторы работают под персональными учётными записями с назначенными ролями (администратор безопасности, сети, аудита), а первичная учётная запись, созданная при инициализации ЦУС, для повседневной работы не используется?
      hint: "МК → «Администрирование» → «Администраторы» и «Роли»"
    assert: { op: eq, value: "yes" }
    severity: medium
    remediation: "Создать персональные учётные записи и роли с минимально необходимыми привилегиями; первичную учётку использовать только для аварийного доступа."
    refs:
      - { source: "Континент 4.2.1: Администрирование комплекса, роли администраторов" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.5" }

  - id: kontinent4.ssh_access_restricted
    title: SSH-доступ к локальному меню выключен или ограничен адресами администраторов
    probe:
      type: manual
      answer: choice
      choices: ["выключен", "включён, адреса ограничены", "включён без ограничения адресов"]
      question: Как настроен дистанционный доступ по SSH к локальному меню узла безопасности?
      hint: "МК → свойства УБ → раздел «SSH» (переключатель и список сетевых объектов); в локальном меню — «Настройки | Сеть | Настройки SSH». По умолчанию доступ отключён"
    assert: { op: in, value: ["выключен", "включён, адреса ограничены"] }
    severity: high
    remediation: "Выключить SSH или оставить в списке только сети/узлы администраторов (до 10 адресов); настройку из ЛМ продублировать в МК и установить политику."
    refs:
      - { source: "Континент 4.2.1: Дистанционный доступ по протоколу SSH" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.5" }

  - id: kontinent4.inactivity_timeout
    title: Сеанс локального меню завершается при бездействии не дольше чем через 15 минут
    probe:
      type: manual
      answer: number
      unit: секунд
      question: Какой тайм-аут неактивности задан в локальном меню УБ?
      hint: "Локальное меню УБ → «Настройки | Настройка тайм-аута неактивности» (10–3600 секунд, по умолчанию 300)"
    assert: { op: between, value: [10, 900] }
    severity: low
    remediation: "Задать тайм-аут неактивности не больше 900 секунд (по умолчанию 300)."
    refs:
      - { source: "Континент 4.2.1: Настройка тайм-аута неактивности" }

  - id: kontinent4.snmp_secure
    title: SNMP выключен или работает по v3 с аутентификацией и шифрованием
    probe:
      type: manual
      answer: choice
      choices: ["SNMP выключен", "SNMP v3: аутентификация SHA и шифрование AES", "SNMP v3 без шифрования или с DES/MD5", "SNMP v2 (сообщество)"]
      question: Как настроен доступ по SNMP к узлу безопасности?
      hint: "МК → «Структура» → УБ → «Свойства» → «Узел безопасности» → «SNMP»"
    assert: { op: in, value: ["SNMP выключен", "SNMP v3: аутентификация SHA и шифрование AES"] }
    severity: medium
    remediation: "Перейти на SNMP v3 с аутентификацией SHA и шифрованием AES или выключить SNMP; ограничить интерфейсы, на которых слушается SNMP."
    refs:
      - { source: "Континент 4.2.1: Контроль узлов безопасности по протоколу SNMP" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.8" }

  - id: kontinent4.remote_syslog
    title: Журналы отправляются на внешний syslog-сервер
    probe:
      type: manual
      question: Настроена отправка журналов узлов безопасности на внешний syslog-сервер (SIEM)?
      hint: "МК → «Журналы» / настройки журналирования → «Отправка журналов на syslog-сервер»"
    assert: { op: eq, value: "yes" }
    severity: low
    remediation: "Настроить отправку журналов на syslog-сервер или во внешнюю базу данных с длительным хранением."
    refs:
      - { source: "Континент 4.2.1: Отправка журналов на syslog-сервер" }
