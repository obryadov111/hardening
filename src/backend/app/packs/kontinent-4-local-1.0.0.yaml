# Пак «Континент 4 — локальные настройки узла». Проверка ПО ОПРОСУ.
#
# Пак kontinent-4 читает политику ЦУС по API. Пароль BIOS, пароль загрузчика (локального меню)
# и тайм-аут неактивности локального меню хранятся на самом узле и в выгрузку ЦУС не попадают.
# Эти три пункта остаются вопросами аудитору. Версию ПО для БДУ берёт автоматический пак.
#
# maturity: draft. Вопросы те же, что в kontinent-4 1.0.0; на живом узле после API-сбора их
# по-прежнему отвечает аудитор. Версия здесь — на случай, когда автоматический снимок не снимался:
# иначе сопоставлять с БДУ нечего.
#
# Заводские пароли из документации: BIOS — 123456; загрузчик после обновления — Passgrub.1.

pack: kontinent-4-local
version: 1.0.0
maturity: draft
tags: [network-device, security-gateway, firewall, securitycode, kontinent-4]
transport: manual
asset_type: network-device

firmware:
  vendor: ООО «Код Безопасности»
  product: комплекс безопасности «континент». версия 4
  version_probe:
    type: manual
    answer: text
    question: Версия ПО узла безопасности (например, 4.2.1)
    hint: "МК → «Структура» → узел безопасности → «Свойства», поле версии обновления (update_version)"

checks:
  - id: kontinent4.loader_password_changed
    title: Пароль доступа к локальному меню (загрузчика) сменён, заводской Passgrub.1 не используется
    probe:
      type: manual
      question: Пароль загрузчика для доступа к локальному меню сменён после установки и после последнего обновления комплекса?
      hint: "Локальное меню УБ → «Настройки | Настройки загрузчика». После обновления устанавливается пароль по умолчанию Passgrub.1"
    assert: { op: eq, value: "yes" }
    severity: critical
    remediation: "Сменить пароль в «Настройки | Настройки загрузчика» на каждом УБ, в том числе после каждого обновления ПО."
    refs:
      - { source: "Континент 4.2.1: Смена пароля доступа к локальному меню" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.3" }

  - id: kontinent4.bios_password_changed
    title: Пароль BIOS узла безопасности сменён (не заводской 123456)
    probe:
      type: manual
      question: Пароль входа в меню установки BIOS узла безопасности отличается от заводского 123456?
      hint: "При загрузке УБ — вход в BIOS (<Del>, <F1> или <F2>), вкладка Security"
    assert: { op: eq, value: "yes" }
    severity: high
    remediation: "Сменить пароль администратора BIOS на каждом УБ (раздел «Смена пароля для входа в меню установки BIOS»)."
    refs:
      - { source: "Континент 4.2.1: Смена пароля для входа в меню установки BIOS" }
      - { source: "Методика анализа защищённости информационных систем, ФСТЭК России, 25.11.2025", id: "УСИ.3" }

  - id: kontinent4.inactivity_timeout
    title: Сеанс локального меню завершается при бездействии не дольше чем через 15 минут
    probe:
      type: manual
      answer: number
      unit: секунд
      question: Какой тайм-аут неактивности задан в локальном меню УБ?
      hint: "Локальное меню УБ → «Настройки | Настройка тайм-аута неактивности» (10–3600 секунд, по умолчанию 300)"
    assert: { op: between, value: [10, 900] }
    severity: low
    remediation: "Задать тайм-аут неактивности не больше 900 секунд (по умолчанию 300)."
    refs:
      - { source: "Континент 4.2.1: Настройка тайм-аута неактивности" }
